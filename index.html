<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DragonTown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e;
    font-family: 'Trebuchet MS', Tahoma, sans-serif; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10; overflow: hidden; }
  .hidden { display: none !important; }

  /* === ГЛАВНОЕ МЕНЮ === */
  #mainMenu { background: linear-gradient(180deg, #2a1a3e 0%, #1a1a2e 100%); padding: 20px; }
  .logo { font-size: 48px; font-weight: 900; letter-spacing: 3px; color: #ffd966;
    text-shadow: 3px 3px 0 #8a4a1a, 6px 6px 0 rgba(0,0,0,0.4), 0 0 30px rgba(255,140,0,0.6); margin-bottom: 6px; }
  .logo .accent { color: #ff6b35; }
  .subtitle { color: #aaa; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 22px; }
  .menuCharacterName { display: flex; align-items: center; gap: 8px; background: #fff;

    margin-bottom: 14px; min-width: 300px; justify-content: center; border: 2px solid #ffd966; }
  .menuCharacterName .badge { background: #ff6b35; color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .menuPreviewBox { background: #7ec87e; border-radius: 12px; padding: 6px; margin-bottom: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5); border: 3px solid #8a4a1a; }
  #menuPreview { display: block; border-radius: 6px; }
  #playBtn { background: linear-gradient(180deg, #4caf50, #2e7d32); color: #fff; font-size: 19px;
    font-weight: bold; padding: 13px 60px; border: none; border-radius: 8px; cursor: pointer;
    letter-spacing: 1px; box-shadow: 0 4px 0 #1b5e20, 0 6px 15px rgba(0,0,0,0.4);
    transition: transform 0.1s; margin-bottom: 12px; }
  #playBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b5e20; }
  #playBtn:hover { background: linear-gradient(180deg, #5cbf60, #388e3c); }
  .menuLinks { display: flex; gap: 20px; margin-top: 4px; }
  .menuLinks a { color: #ffd966; text-decoration: none; font-size: 13px; cursor: pointer; border-bottom: 1px dashed #ffd966; }
  .menuLinks a:hover { color: #fff; }
  .rulesBox { position: absolute; bottom: 12px; left: 12px; right: 12px; color: #888;
    font-size: 11px; text-align: center; line-height: 1.5; }
  .rulesBox b { color: #ff6b35; }

  /* === СЕРВЕРА === */
  #serverScreen { background: #1a1a2e; padding: 15px; overflow-y: auto; justify-content: flex-start; padding-top: 25px; }
  #serverScreen h2 { color: #ffd966; font-size: 22px; margin-bottom: 15px; letter-spacing: 2px; }
  .serverTopBar { display: flex; gap: 8px; width: 100%; max-width: 480px; margin-bottom: 15px; }
  .serverTopBar input { flex: 1; background: #fff; border: none; border-radius: 6px; padding: 10px; font-size: 14px; color: #333; outline: none; }
  .serverTopBar button { background: #fff; border: none; border-radius: 6px; padding: 10px 14px; font-size: 13px; font-weight: bold; color: #333; cursor: pointer; }
  .serverList { width: 100%; max-width: 480px; display: flex; flex-direction: column; }
  .serverItem { display: flex; align-items: center; gap: 12px; padding: 14px 12px;
    border-bottom: 1px solid #333; cursor: pointer; border-radius: 6px; transition: background 0.15s; }
  .serverItem:hover { background: #2a2a40; }
  .serverItem .flag { font-size: 24px; min-width: 32px; text-align: center; }
  .serverItem .info { flex: 1; text-align: left; }
  .serverItem .title { color: #fff; font-size: 15px; font-weight: bold; margin-bottom: 2px; }
  .serverItem .desc { color: #888; font-size: 12px; }
  .serverItem.adult .title { color: #ff6b35; }
  .serverItem.safe .title { color: #6b9fff; }

  /* === РЕДАКТОР === */
  #creatorScreen { background: #1e1e28; padding: 0; justify-content: flex-start; overflow-y: auto; }
  .creatorTop { position: sticky; top: 0; width: 100%; background: #252532;
    display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; z-index: 20; gap: 8px;
    border-bottom: 2px solid #3a3a4a; }
  .creatorTop button { background: #3a3a4a; border: none; border-radius: 8px; padding: 9px 18px;
    font-size: 14px; font-weight: bold; color: #eee; cursor: pointer; transition: 0.15s; }
  .creatorTop button:hover { background: #4a4a5a; }
  .creatorTop button.primary { background: linear-gradient(180deg, #5cb85c, #3d8b3d); color: #fff; }
  .creatorTop button.primary:hover { background: linear-gradient(180deg, #6cc86c, #4d9b4d); }
  .creatorTabs { display: flex; gap: 4px; padding: 10px 12px 0; width: 100%; justify-content: center; flex-wrap: wrap; }
  .creatorTabs .tab { background: #2e2e3a; color: #aaa; padding: 9px 16px;
    border-radius: 8px 8px 0 0; cursor: pointer; font-size: 12px; font-weight: bold; letter-spacing: 0.5px;
    border: 1px solid #3a3a4a; border-bottom: none; transition: 0.15s; }
  .creatorTabs .tab:hover { background: #3a3a4a; color: #fff; }
  .creatorTabs .tab.active { background: #ff6b35; color: #fff; border-color: #ff6b35; }
  .previewArea { position: relative; width: 100%; display: flex; justify-content: center;
    align-items: center; background: linear-gradient(180deg, #2a3a2a 0%, #1a2a1a 100%); padding: 16px 0; min-height: 320px; }
  #previewCanvas { background: #7ec87e; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.7), inset 0 0 0 3px #5a9a5a; }
  .previewControls { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 20px; }
  .previewControls button { width: 36px; height: 36px; border: none; border-radius: 50%;
    background: #3a3a4a; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .previewControls button:hover { background: #ff6b35; }
  .previewControls button.active { background: #ff6b35; }
  .creatorPanel { width: 100%; max-width: 580px; background: #252532; padding: 16px;
    margin: 0 auto 20px; border-radius: 0 0 12px 12px; color: #fff; border: 1px solid #3a3a4a; border-top: none; }
  .creatorPanel .row { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #333; }
  .creatorPanel .row:last-child { border-bottom: none; margin-bottom: 0; }
  .creatorPanel label { display: block; font-size: 11px; color: #ff6b35;
    margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: bold; }
  .colorGrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .colorSwatch { aspect-ratio: 1; border-radius: 10px; cursor: pointer; border: 3px solid #444;
    transition: transform 0.12s, border-color 0.12s; position: relative; }
  .colorSwatch:hover { transform: scale(1.1); }
  .colorSwatch.active { border-color: #fff; box-shadow: 0 0 0 3px #ff6b35, 0 0 16px rgba(255,107,53,0.7); }
  .colorPickerRow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .colorPickerRow input[type="color"] { width: 48px; height: 48px; border: none; border-radius: 10px;
    cursor: pointer; background: none; padding: 0; }
  .colorPickerRow .hexInput { flex: 1; min-width: 90px; padding: 10px; background: #1a1a22; border: 2px solid #444;
    border-radius: 8px; color: #fff; font-size: 14px; font-family: monospace; outline: none; }
  .colorPickerRow .hexInput:focus { border-color: #ff6b35; }
  .styleGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .styleBtn { padding: 12px 8px; background: #2e2e3a; border: 2px solid #444; border-radius: 10px;
    color: #ccc; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.15s; }
  .styleBtn:hover { background: #3a3a4a; color: #fff; }
  .styleBtn.active { background: #ff6b35; border-color: #fff; color: #fff; }
  .nameInputGroup { display: flex; gap: 8px; }
  .nameInputGroup input { flex: 1; padding: 12px; background: #1a1a22; border: 2px solid #444;
    border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
  .nameInputGroup input:focus { border-color: #ff6b35; }
  .randomBtn { background: linear-gradient(180deg, #9b59b6, #7d3c98); color: #fff; border: none;
    border-radius: 8px; padding: 10px 18px; font-weight: bold; cursor: pointer; font-size: 13px; }
  .randomBtn:hover { filter: brightness(1.1); }
  .hint { color: #888; font-size: 12px; line-height: 1.5; margin-top: 6px; }

  /* === МИР === */
  #worldScreen { background: #c8b878; }
  #worldCanvas { display: block; }
  #worldUI { position: absolute; top: 10px; left: 10px; color: #fff;
    text-shadow: 1px 1px 2px #000; pointer-events: none; z-index: 5; }
  #worldUI .name { font-size: 16px; font-weight: bold; color: #ffd966; }
  #worldUI .pos { font-size: 12px; color: #ccc; }
  #animBar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; background: rgba(0,0,0,0.6); padding: 6px 10px;
    border-radius: 12px; z-index: 6; flex-wrap: wrap; justify-content: center; max-width: 96%; }
  #animBar .animBtn { width: 46px; height: 46px; background: #2a2a40; border: 2px solid #555;
    border-radius: 8px; color: #fff; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  #animBar .animBtn:hover { background: #3a3a55; }
  #animBar .animBtn.active { background: #ff6b35; border-color: #fff; }
  #chatBox { position: absolute; bottom: 70px; left: 10px; width: 320px; max-width: 60%; z-index: 6; pointer-events: none; }
  #chatHistory { background: rgba(0,0,0,0.55); border-radius: 8px; padding: 6px 10px;
    color: #fff; font-size: 12px; max-height: 150px; overflow-y: auto; pointer-events: auto;
    margin-bottom: 4px; line-height: 1.4; }
  #chatHistory .msg { margin-bottom: 3px; word-wrap: break-word; }
  #chatHistory .msg .nick { color: #ffd966; font-weight: bold; }
  #chatHistory .msg.sys { color: #aaa; font-style: italic; }
  #chatTabs { display: flex; gap: 4px; margin-bottom: 4px; pointer-events: auto; }
  #chatTabs .tab { background: rgba(0,0,0,0.55); color: #ccc; padding: 4px 10px;
    border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
  #chatTabs .tab.active { background: #ff6b35; color: #fff; }
  #chatInputWrap { display: flex; gap: 4px; pointer-events: auto; }
  #chatInput { flex: 1; background: rgba(0,0,0,0.6); border: 2px solid #555; border-radius: 6px;
    padding: 6px 10px; color: #fff; font-size: 13px; outline: none; }
  #chatInput::placeholder { color: #888; }
  #chatSend { background: #ff6b35; color: #fff; border: none; border-radius: 6px;
    padding: 6px 12px; font-weight: bold; cursor: pointer; font-size: 13px; }
  #soundBtn { position: absolute; top: 10px; right: 10px; width: 42px; height: 42px;
    background: rgba(0,0,0,0.6); border: 2px solid #ffd966; border-radius: 50%;
    color: #ffd966; font-size: 18px; cursor: pointer; z-index: 15;
    display: flex; align-items: center; justify-content: center; }
  #soundBtn.off { color: #666; border-color: #666; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  ::-webkit-scrollbar-thumb { background: #ff6b35; border-radius: 3px; }
</style>

</head>
<body>

<!-- ============ ГЛАВНОЕ МЕНЮ ============ -->
<div id="mainMenu" class="screen">
  <div class="logo">Dragon<span class="accent">Town</span></div>
  <div class="subtitle">социальный мир драконов</div>

  <div class="menuCharacterName" id="menuCharName">
    <span>🐉</span>
    <span id="menuNameText">Дракон</span>
    <span class="badge">RU</span>
  </div>

  <div class="menuPreviewBox">
    <canvas id="menuPreview" width="220" height="220"></canvas>
  </div>

  <button id="playBtn">▶ ИГРАТЬ</button>

  <div class="menuLinks">
    <a id="linkEdit">Редактор</a>
    <a id="linkRules">Правила</a>
  </div>

  <div class="rulesBox">
    <b>Правила:</b> не спамить · не использовать читы · уважать других игроков
  </div>
</div>

<!-- ============ ВЫБОР СЕРВЕРА ============ -->
<div id="serverScreen" class="screen hidden">
  <h2>🌐 ВЫБОР СЕРВЕРА</h2>

  <div class="serverTopBar">
    <input id="serverNameInput" maxlength="16" value="Дракон" placeholder="Имя дракона">
    <button id="serverBackBtn">← Назад</button>
  </div>

  <div class="serverList" id="serverList"></div>
</div>

<!-- ============ РЕДАКТОР ДРАКОНА (от Grok) ============ -->
<div id="creatorScreen" class="screen hidden">

  <div class="creatorTop">
    <button id="creatorBackBtn">← Назад</button>
    <div style="color:#fff;font-weight:bold;letter-spacing:1px;font-size:14px">🐉 РЕДАКТОР ДРАКОНА</div>
    <button id="creatorSaveBtn" class="primary">Сохранить</button>
  </div>

  <div class="creatorTabs" id="creatorTabs">
    <div class="tab active" data-tab="color">ЦВЕТ</div>
    <div class="tab" data-tab="style">СТИЛЬ</div>
    <div class="tab" data-tab="anim">АНИМАЦИЯ</div>
    <div class="tab" data-tab="name">ИМЯ</div>
  </div>

  <div class="previewArea">
    <canvas id="previewCanvas" width="340" height="300"></canvas>
    <div class="previewControls" id="previewControls">
      <button id="prevFlip" title="Отразить">🔄</button>
      <button id="prevPause" title="Пауза">⏸</button>
      <button id="prevRandom" title="Случайный">🎲</button>
    </div>
  </div>

  <div class="creatorPanel" id="creatorPanel"></div>

</div>

<!-- ============ МИР ============ -->
<div id="worldScreen" class="screen hidden">
  <canvas id="worldCanvas"></canvas>

  <div id="worldUI">
    <div class="name" id="worldName">Дракон</div>
    <div class="pos">Позиция: <span id="worldPos">0, 0</span></div>
  </div>

  <div id="soundBtn" title="Звук">🔊</div>

  <div id="animBar">
    <div class="animBtn active" data-anim="stand" title="Стоять">🧍</div>
    <div class="animBtn" data-anim="walk" title="Идти">🚶</div>
    <div class="animBtn" data-anim="sit" title="Сидеть">🪑</div>
    <div class="animBtn" data-anim="dance" title="Танцевать">💃</div>
    <div class="animBtn" data-anim="wave" title="Махать">👋</div>
    <div class="animBtn" data-anim="roar" title="Рёв">🦁</div>
  </div>

  <div id="chatBox">
    <div id="chatHistory"></div>
    <div id="chatTabs">
      <div class="tab active" data-chat="local">Local</div>
      <div class="tab" data-chat="global">Party</div>
      <div class="tab" data-chat="system">Personal</div>
    </div>
    <div id="chatInputWrap">
      <input id="chatInput" maxlength="120" placeholder="Написать сообщение...">
      <button id="chatSend">→</button>
    </div>
  </div>
</div>

<!-- ЧАСТЬ 2 ЗАКОНЧЕНА -->
<script>
// ============================================================
//  ЧАСТЬ 3: состояние + звук + утилиты
// ============================================================

// ---------- Конфиг дракона ----------
// Эти же поля будут использоваться И редактором, И миром.

const CONFIG = {
  name: 'Дракон',

  // Индекс цвета дракона (0..9) — для PNG-спрайтов
  colorIndex: 0,

  // Устаревшие поля (для процедурного дракона, уже не используются)
  bodyColor:  '#c02020',
  bellyColor: '#f0c040',
  wingColor:  '#e08020',
  hornColor:  '#f0e0a0',
  eyeColor:   '#222222',
  crestColor: '#ff6b35',

  // Стили (не используются в новой версии)
  hornStyle: 1,
  wingStyle: 1,
  eyeStyle:  0,
  scale:     1.0,

  // Анимация
  animation: 'stand'
};

// Палитра предустановленных цветов (та же, что у Grok)
const PRESET_COLORS = [
  '#c02020', '#e04040', '#e08020', '#f0a030', '#f0c040', '#e0e060',
  '#40a040', '#30c060', '#40b0b0', '#20a0c0', '#4080d0', '#3060e0',
  '#8050b0', '#a040c0', '#e04080', '#f060a0', '#f0f0e0', '#d0d0d0',
  '#303030', '#505050', '#8a4a1a', '#a06030', '#ff6b35', '#ff9f43'
];

// ---------- Текущий экран ----------
let currentScreen = 'mainMenu';

// ---------- Утилиты ----------
function $(id) { return document.getElementById(id); }

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
  currentScreen = id;
}

// Осветление / затемнение hex-цвета
function shade(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00ff) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000ff) + amt));
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// Рандом
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ============================================================
//  ЗВУК (Web Audio API)
// ============================================================
const Sound = (() => {
  let ctxA = null;
  let enabled = true;
  let ambientGain = null;
  let ambientStarted = false;

  function ensure() {
    if (!ctxA) {
      try { ctxA = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    if (ctxA.state === 'suspended') ctxA.resume();
    return ctxA;
  }

  function beep(freq, duration, type = 'square', volume = 0.06) {
    const c = ensure(); if (!c || !enabled) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(volume, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + duration + 0.01);
  }

  function click() { beep(660, 0.08, 'square', 0.06); }
  function hover() { beep(880, 0.05, 'sine', 0.025); }

  function step() {
    const c = ensure(); if (!c || !enabled) return;
    const o = c.createOscillator(); const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180 + Math.random() * 40, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(60, c.currentTime + 0.08);
    g.gain.setValueAtTime(0.03, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.1);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.11);
  }

  function sit() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const o = c.createOscillator(); const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(440, t);
    o.frequency.exponentialRampToValueAtTime(220, t + 0.35);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.45);
  }

  function dance() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const notes = [523, 659, 784, 1046, 784, 659];
    notes.forEach((fr, i) => {
      const o = c.createOscillator(); const g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(fr, t + i * 0.08);
      g.gain.setValueAtTime(0.0001, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.07, t + i * 0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.15);
      o.connect(g); g.connect(c.destination);
      o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.18);
    });
  }

  function wave() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const o = c.createOscillator(); const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(1200, t + 0.18);
    o.frequency.exponentialRampToValueAtTime(800, t + 0.28);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.35);
  }

  function roar() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const o1 = c.createOscillator(); const o2 = c.createOscillator();
    const g = c.createGain(); const f = c.createBiquadFilter();
    o1.type = 'sawtooth'; o2.type = 'square';
    o1.frequency.setValueAtTime(95, t);
    o1.frequency.linearRampToValueAtTime(60, t + 0.7);
    o2.frequency.setValueAtTime(48, t);
    o2.frequency.linearRampToValueAtTime(32, t + 0.7);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(200, t + 0.7);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(c.destination);
    o1.start(t); o2.start(t); o1.stop(t + 0.8); o2.stop(t + 0.8);
  }

  function enterWorld() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    [440, 550, 660, 880].forEach((fr, i) => {
      const o = c.createOscillator(); const g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(fr, t + i * 0.08);
      g.gain.setValueAtTime(0.0001, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.06, t + i * 0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.25);
      o.connect(g); g.connect(c.destination);
      o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.28);
    });
  }

  function save() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    [520, 780].forEach((fr, i) => {
      const o = c.createOscillator(); const g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(fr, t + i * 0.1);
      g.gain.setValueAtTime(0.0001, t + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.08, t + i * 0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.2);
      o.connect(g); g.connect(c.destination);
      o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.22);
    });
  }

  function chatMsg() {
    beep(880, 0.06, 'sine', 0.04);
    setTimeout(() => beep(1100, 0.06, 'sine', 0.03), 60);
  }

  function startAmbient() {
    const c = ensure(); if (!c || !enabled || ambientStarted) return;
    ambientStarted = true;
    const bufferSize = 2 * c.sampleRate;
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource();
    noise.buffer = buffer; noise.loop = true;
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 320;
    ambientGain = c.createGain(); ambientGain.gain.value = 0.012;
    noise.connect(filter); filter.connect(ambientGain); ambientGain.connect(c.destination);
    noise.start();
  }

  function toggle() {
    enabled = !enabled;
    if (ambientGain) ambientGain.gain.value = enabled ? 0.012 : 0;
    return enabled;
  }

  return {
    click, hover, step, sit, dance, wave, roar,
    enterWorld, save, chatMsg, startAmbient, toggle, ensure
  };
})();

// Кеш нарезанных кадров
// dragonFrames[colorIndex] = [frame0, frame1, ..., frame5]
let dragonFrames = [];
let dragonReady = false;

// Загрузка base64 как Image
function loadImageSrc(src) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = function () { reject(new Error(src)); };
    img.src = src;
  });
}

// Проверка: светлый/серый пиксель?
function isNeutralLight(r, g, b) {
  var mx = r > g ? r : g;
  if (b > mx) mx = b;
  var mn = r < g ? r : g;
  if (b < mn) mn = b;
  var lum = (r + g + b) / 3;
  return (mx - mn) <= 28 && lum >= 140;
}

// ============================================================
//  Нарезка одной полосы (PNG с 6 кадрами) на 6 чистых кадров
// ============================================================
function sliceSheet(img) {
  var w = img.width;
  var h = img.height;

  var canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);

  var imageData;
  try {
    imageData = ctx.getImageData(0, 0, w, h);
  } catch (err) {
    var blocked = new Error('tainted');
    blocked.cause = err;
    throw blocked;
  }

  var data = imageData.data;
  var n = w * h;
  var neutral = new Uint8Array(n);
  var dark = new Uint8Array(n);
  var whiteish = new Uint8Array(n);
  var i, o, r, g, b, lum, mx, mn;

  // Проход 1: классификация пикселей
  for (i = 0; i < n; i++) {
    o = i * 4;
    r = data[o];
    g = data[o + 1];
    b = data[o + 2];

    mx = r > g ? r : g;
    if (b > mx) mx = b;
    mn = r < g ? r : g;
    if (b < mn) mn = b;
    lum = (r + g + b) / 3;

    if (lum < 80) dark[i] = 1;
    if ((mx - mn) <= 28 && lum >= 210) whiteish[i] = 1;
    if (isNeutralLight(r, g, b)) neutral[i] = 1;
  }

  // Проход 2: не удалять белые пиксели, если рядом тёмная обводка
  var y, x, dy, dx, yy, xx, near;
  for (y = 0; y < h; y++) {
    for (x = 0; x < w; x++) {
      i = y * w + x;
      if (!whiteish[i]) continue;
      near = false;
      for (dy = -2; dy <= 2 && !near; dy++) {
        yy = y + dy;
        if (yy < 0 || yy >= h) continue;
        for (dx = -2; dx <= 2; dx++) {
          xx = x + dx;
          if (xx < 0 || xx >= w) continue;
          if (dark[yy * w + xx]) { near = true; break; }
        }
      }
      if (near) neutral[i] = 0;
    }
  }

  // Проход 3: flood fill от краёв — удаляем шахматку
  var seen = new Uint8Array(n);
  var stack = [];

  function pushBg(px, py) {
    if (px < 0 || py < 0 || px >= w || py >= h) return;
    var idx = py * w + px;
    if (seen[idx] || !neutral[idx]) return;
    seen[idx] = 1;
    stack.push(idx);
  }

  for (x = 0; x < w; x++) { pushBg(x, 0); pushBg(x, h - 1); }
  for (y = 0; y < h; y++) { pushBg(0, y); pushBg(w - 1, y); }

  while (stack.length) {
    i = stack.pop();
    data[i * 4 + 3] = 0;
    x = i % w;
    y = (i / w) | 0;
    pushBg(x - 1, y);
    pushBg(x + 1, y);
    pushBg(x, y - 1);
    pushBg(x, y + 1);
  }

  // Проход 4: connected components — поиск 6 драконов
  var label = new Int32Array(n);
  var comps = [];
  var nextId = 0;

  function flood(sx, sy, id) {
    var local = [sy * w + sx];
    label[sy * w + sx] = id;

    var minX = sx, maxX = sx, minY = sy, maxY = sy, count = 0;

    while (local.length) {
      var idx = local.pop();
      count++;
      var cx = idx % w;
      var cy = (idx / w) | 0;
      if (cx < minX) minX = cx;
      if (cx > maxX) maxX = cx;
      if (cy < minY) minY = cy;
      if (cy > maxY) maxY = cy;

      visit(cx - 1, cy);
      visit(cx + 1, cy);
      visit(cx, cy - 1);
      visit(cx, cy + 1);
    }

    return {
      id: id, minX: minX, minY: minY,
      maxX: maxX, maxY: maxY, count: count
    };

    function visit(nx, ny) {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) return;
      var j = ny * w + nx;
      if (label[j] || data[j * 4 + 3] < 16) return;
      label[j] = id;
      local.push(j);
    }
  }

  for (y = 0; y < h; y++) {
    for (x = 0; x < w; x++) {
      i = y * w + x;
      if (label[i] || data[i * 4 + 3] < 16) continue;
      nextId++;
      comps.push(flood(x, y, nextId));
    }
  }

  // Оставляем 6 крупнейших, сортируем по X
  comps.sort(function (a, b) { return b.count - a.count; });
  var top = comps.slice(0, 6).sort(function (a, b) { return a.minX - b.minX; });

  if (top.length < 6) return equalFrames(data, w, h);

  return top.map(function (comp) {
    return componentFrame(data, label, w, comp);
  });
}

// Fallback: деление картинки на 6 равных
function equalFrames(data, w, h) {
  var frames = [];
  for (var f = 0; f < 6; f++) {
    var x0 = Math.round(f * w / 6);
    var x1 = Math.round((f + 1) * w / 6);
    var minX = x1, minY = h, maxX = x0 - 1, maxY = -1;

    for (var y = 0; y < h; y++) {
      for (var x = x0; x < x1; x++) {
        if (data[(y * w + x) * 4 + 3] < 16) continue;
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
    if (maxX < minX) { frames.push(blankFrame()); continue; }
    frames.push(makeFrame(data, w, minX, minY, maxX, maxY, -1, null));
  }
  return frames;
}

// Создать кадр из компоненты
function componentFrame(data, label, w, comp) {
  return makeFrame(data, w, comp.minX, comp.minY, comp.maxX, comp.maxY, comp.id, label);
}

// Общая функция создания кадра
function makeFrame(data, w, minX, minY, maxX, maxY, compId, label) {
  var bw = maxX - minX + 1;
  var bh = maxY - minY + 1;

  var tmp = document.createElement('canvas');
  tmp.width = bw;
  tmp.height = bh;
  var tctx = tmp.getContext('2d');
  var td = tctx.createImageData(bw, bh);

  for (var y = 0; y < bh; y++) {
    for (var x = 0; x < bw; x++) {
      var si = (y + minY) * w + (x + minX);
      if (compId >= 0 && label[si] !== compId) continue;
      var so = si * 4;
      var di = (y * bw + x) * 4;
      td.data[di]     = data[so];
      td.data[di + 1] = data[so + 1];
      td.data[di + 2] = data[so + 2];
      td.data[di + 3] = data[so + 3];
    }
  }
  tctx.putImageData(td, 0, 0);
  return fit96(tmp);
}

function blankFrame() {
  var frame = document.createElement('canvas');
  frame.width = 96;
  frame.height = 96;
  return frame;
}

// Вписать кадр в квадрат 96×96 без сглаживания
function fit96(src) {
  var frame = document.createElement('canvas');
  frame.width = 96;
  frame.height = 96;
  var fctx = frame.getContext('2d');
  fctx.imageSmoothingEnabled = false;

  var pad = 6;
  var scale = Math.min((96 - pad * 2) / src.width, (96 - pad * 2) / src.height);
  var dw = Math.max(1, Math.round(src.width * scale));
  var dh = Math.max(1, Math.round(src.height * scale));
  var dx = Math.round((96 - dw) / 2);
  var dy = Math.round((96 - dh) / 2 + 2);

  fctx.drawImage(src, dx, dy, dw, dh);
  return frame;
}

// ============================================================
//  Загрузка и нарезка всех 10 полос
// ============================================================
function loadColorPng(file) {
  var packed = (typeof EMBEDDED === 'object' && EMBEDDED) ? EMBEDDED[file] : null;
  if (!packed) return Promise.reject(new Error('missing base64 for ' + file));
  return loadImageSrc(packed).then(sliceSheet);
}

function loadAllDragons() {
  var promises = DRAGON_FILES.map(function (d) {
    return loadColorPng(d.file).then(function (frames) {
      return { hex: d.hex, name: d.name, frames: frames };
    });
  });

  return Promise.all(promises).then(function (list) {
    dragonFrames = list.map(function (item) { return item.frames; });
    dragonReady = true;
    console.log('%c🐉 Все 10 драконов загружены и нарезаны', 'color:#4caf50;font-weight:bold');
  }).catch(function (err) {
    console.error('Ошибка загрузки спрайтов:', err);
  });
}

// ============================================================
//  Отрисовка дракона из спрайта
// ============================================================
// ctx       — контекст
// cx, cy    — центр кадра
// size      — размер (96 → 96 на экране)
// colorIndex — 0..9
// frame     — 0..5
// facing    — true = влево
function drawDragonSprite(ctx, cx, cy, size, colorIndex, frame, facing) {
  if (!dragonReady) return;

  var colorFrames = dragonFrames[colorIndex];
  if (!colorFrames) return;

  frame = ((frame % 6) + 6) % 6;
  var sprite = colorFrames[frame];
  if (!sprite) return;

  var drawW = size;
  var drawH = size;

  ctx.save();
  ctx.imageSmoothingEnabled = false;

  if (facing) {
    ctx.translate(cx, cy);
    ctx.scale(-1, 1);
    ctx.drawImage(sprite, -drawW / 2, -drawH / 2, drawW, drawH);
  } else {
    ctx.drawImage(sprite, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
  }

  ctx.restore();
}

// Тень под драконом
function drawDragonShadow(ctx, cx, cy, size) {
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(cx, cy, size * 0.22, size * 0.07, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ============================================================
//  Декорации для мира (без внешних картинок)
// ============================================================
function drawTree(ctx, x, y, r) {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(x, y + r * 0.3, r * 0.7, r * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(x - r * 0.12, y - r * 0.6, r * 0.24, r * 0.65);

  ctx.fillStyle = '#2d6a2d';
  ctx.beginPath(); ctx.arc(x, y - r * 0.7, r * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3d8a3d';
  ctx.beginPath(); ctx.arc(x - r * 0.2, y - r * 0.85, r * 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.18, y - r * 0.9, r * 0.32, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4daa4d';
  ctx.beginPath(); ctx.arc(x, y - r * 1.05, r * 0.28, 0, Math.PI * 2); ctx.fill();
}

function drawHouse(ctx, x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(x - w * 0.4 + 6, y - 6, w * 0.8, 10);

  ctx.fillStyle = '#c4a574';
  ctx.fillRect(x - w * 0.4, y - h * 0.55, w * 0.8, h * 0.55);

  ctx.fillStyle = '#8a3a2a';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.5, y - h * 0.5);
  ctx.lineTo(x, y - h * 0.95);
  ctx.lineTo(x + w * 0.5, y - h * 0.5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(x - w * 0.1, y - h * 0.28, w * 0.2, h * 0.28);

  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(x - w * 0.28, y - h * 0.42, w * 0.12, h * 0.12);
  ctx.fillRect(x + w * 0.16, y - h * 0.42, w * 0.12, h * 0.12);
}

// Стартуем загрузку сразу
loadAllDragons();

console.log('%c📦 Часть 4 — загрузчик спрайтов готов', 'color:#4caf50;font-weight:bold');
</script>

    hint.appendChild(h);
    creatorPanel.appendChild(hint);
  }

//  Старт

<script>
// ============================================================
//  ЧАСТЬ 7: WebSocket-клиент
//  Подключение к Worker, приём и отправка сообщений
// ============================================================

// ---------- Состояние сети ----------
const NET = {
  ws: null,
  connected: false,
  myId: null,
  players: new Map(),     // id -> player object (другие игроки)
  chatHistory: [],
  reconnectAttempts: 0,
  reconnectTimer: null,
  pingTimer: null,
  lastPingSent: 0,
  latency: 0
};

// ---------- Маппинг анимаций ----------
// Наш клиент → сервер
function animToServer(anim) {
  switch (anim) {
    case 'stand': return 'idle';
    case 'roar':  return 'dance';
    case 'walk':  return 'walk';
    case 'sit':   return 'sit';
    case 'dance': return 'dance';
    case 'wave':  return 'wave';
    default:      return 'idle';
  }
}

// Сервер → наш клиент
function animFromServer(anim) {
  switch (anim) {
    case 'idle':  return 'stand';
    case 'sleep': return 'sit';
    case 'fly':   return 'walk';
    case 'eat':   return 'roar';
    case 'walk':  return 'walk';
    case 'sit':   return 'sit';
    case 'dance': return 'dance';
    case 'wave':  return 'wave';
    default:      return 'stand';
  }
}

// ---------- Подключение ----------
function connectToServer(url, playerName) {
  // Если уже подключены — отключаемся
  if (NET.ws) {
    try { NET.ws.close(); } catch (e) {}
    NET.ws = null;
  }

  console.log('🌐 Подключение к:', url);

  try {
    NET.ws = new WebSocket(url);
  } catch (e) {
    console.error('Ошибка подключения:', e);
    return;
  }

  NET.ws.onopen = () => {
    NET.connected = true;
    NET.reconnectAttempts = 0;
    console.log('✅ WebSocket подключён');

    // Отправляем имя сразу после подключения
    sendToServer({ type: 'rename', name: playerName });

    // Запускаем ping
    startPing();
  };

  NET.ws.onmessage = (event) => {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch (e) {
      return;
    }
    handleServerMessage(data);
  };

  NET.ws.onerror = (e) => {
    console.warn('WebSocket error:', e);
  };

  NET.ws.onclose = () => {
    NET.connected = false;
    NET.myId = null;
    NET.players.clear();
    console.log('🔌 WebSocket отключён');

    stopPing();

    // Автопереподключение через 3 секунды
    if (currentScreen === 'worldScreen') {
      if (NET.reconnectTimer) clearTimeout(NET.reconnectTimer);
      NET.reconnectTimer = setTimeout(() => {
        console.log('🔄 Переподключение...');
        connectToServer(url, playerName);
      }, 3000);
    }
  };
}

// ---------- Отправка ----------
function sendToServer(obj) {
  if (!NET.ws || NET.ws.readyState !== WebSocket.OPEN) return;
  try {
    NET.ws.send(JSON.stringify(obj));
  } catch (e) {
    console.warn('Ошибка отправки:', e);
  }
}

// ---------- Обработка сообщений с сервера ----------
function handleServerMessage(data) {
  if (!data || typeof data.type !== 'string') return;

  switch (data.type) {

    // ========================================================
    //  Welcome — при подключении
    // ========================================================
    case 'welcome': {
      NET.myId = data.id;
      NET.players.clear();

      if (Array.isArray(data.players)) {
        data.players.forEach(p => {
          if (p.id !== NET.myId) {
            NET.players.set(p.id, p);
          }
        });
      }

      // История чата
      if (Array.isArray(data.chatHistory)) {
        NET.chatHistory = data.chatHistory;
        // Отрисуем историю
        if (typeof renderChatFromNetwork === 'function') {
          renderChatFromNetwork(data.chatHistory);
        }
      }

      console.log('👋 Welcome! Мой ID:', NET.myId);
      console.log('👥 Игроков онлайн:', NET.players.size + 1);

      // Обновляем UI — показываем сколько игроков
      updatePlayerCount();
      break;
    }

    // ========================================================
    //  Игрок присоединился или обновился
    // ========================================================
    case 'player_joined': {
      const p = data.player;
      if (!p || !p.id) return;
      if (p.id === NET.myId) return; // себя не добавляем

      NET.players.set(p.id, p);
      updatePlayerCount();
      break;
    }

    // ========================================================
    //  Игрок двинулся (или сменил анимацию)
    // ========================================================
    case 'player_moved': {
      const id = data.id;
      if (!id || id === NET.myId) return;

      const existing = NET.players.get(id);
      if (!existing) return;

      // Обновляем только изменённые поля
      if (typeof data.x === 'number')        existing.x = data.x;
      if (typeof data.y === 'number')        existing.y = data.y;
      if (typeof data.facing === 'boolean')  existing.facing = data.facing;
      if (typeof data.animation === 'string') existing.animation = animFromServer(data.animation);
      if (typeof data.frame === 'number')    existing.frame = data.frame;

      // Запоминаем время последнего обновления (для плавной интерполяции)
      existing.lastUpdate = performance.now();
      break;
    }

    // ========================================================
    //  Игрок отключился
    // ========================================================
    case 'player_left': {
      const id = data.id;
      if (!id) return;
      NET.players.delete(id);
      updatePlayerCount();
      break;
    }

    // ========================================================
    //  Сообщение в чат
    // ========================================================
    case 'chat_message': {
      if (typeof addChatMessageFromNetwork === 'function') {
        addChatMessageFromNetwork(data);
      }
      break;
    }

    // ========================================================
    //  Pong (ответ на ping)
    // ========================================================
    case 'pong': {
      if (typeof data.time === 'number') {
        NET.latency = Date.now() - NET.lastPingSent;
      }
      break;
    }

    default:
      // неизвестный тип — игнорируем
      break;
  }
}

// ---------- Ping (для проверки соединения) ----------
function startPing() {
  stopPing();
  NET.pingTimer = setInterval(() => {
    if (!NET.connected) return;
    NET.lastPingSent = Date.now();
    sendToServer({ type: 'ping' });
  }, 15000); // каждые 15 секунд
}

function stopPing() {
  if (NET.pingTimer) {
    clearInterval(NET.pingTimer);
    NET.pingTimer = null;
  }
}

// ---------- Отправка своих данных на сервер ----------
function sendMyPosition() {
  if (!NET.connected) return;
  sendToServer({
    type: 'move',
    x: Math.round(player.x),
    y: Math.round(player.y),
    facing: player.facing,
    animation: animToServer(player.animation),
    frame: player.frame
  });
}

// Отправка только анимации (когда она меняется по клику)
function sendMyAnimation() {
  if (!NET.connected) return;
  sendToServer({
    type: 'animation',
    animation: animToServer(player.animation)
  });
}

// Отправка сообщения в чат
function sendChatToServer(text, tab) {
  if (!NET.connected) return false;
  sendToServer({
    type: 'chat',
    text: text,
    tab: tab || 'local'
  });
  return true;
}

// ---------- UI: счётчик игроков ----------
function updatePlayerCount() {
  const el = $('worldPos');
  if (!el) return;

  const total = NET.players.size + (NET.myId ? 1 : 0);
  // Обновляем подсказку вверху экрана (если есть)
  const hint = $('worldUI');
  if (hint && !hint.querySelector('.online')) {
    const div = document.createElement('div');
    div.className = 'online';
    div.style.cssText = 'font-size:12px;color:#8f8;';
    hint.appendChild(div);
  }
  const onlineEl = document.querySelector('#worldUI .online');
  if (onlineEl) {
    const wsState = NET.connected ? '🟢' : '🔴';
    onlineEl.textContent = `${wsState} онлайн: ${total}`;
  }
}

console.log('%c🌐 Часть 7 — WebSocket-клиент готов', 'color:#4caf50;font-weight:bold');
</script>

<script>
// ============================================================
//  ЧАСТЬ 8: игровой мир с другими игроками
//  Карта 2800×2200, деревья, дома, дорожки + мультиплеер
// ============================================================

const worldCanvas = $('worldCanvas');
const wctx = worldCanvas.getContext('2d');
wctx.imageSmoothingEnabled = false;

let WW = window.innerWidth;
let WH = window.innerHeight;

function resizeWorld() {
  WW = window.innerWidth;
  WH = window.innerHeight;
  worldCanvas.width = WW;
  worldCanvas.height = WH;
  wctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', () => {
  if (currentScreen === 'worldScreen') resizeWorld();
});

// ============================================================
//  Мир (генерация — как раньше)
// ============================================================
const WORLD = {
  width: 2800, height: 2200,
  trees: [], houses: [],
  grassPatches: [], grassTufts: [], flowers: [],
  bushes: [], rocks: [], paths: []
};

let _seed = 98765;
function rnd() {
  _seed = (_seed * 9301 + 49297) % 233280;
  return _seed / 233280;
}
function rndRange(a, b) { return a + rnd() * (b - a); }
function rndInt(a, b) { return Math.floor(rndRange(a, b + 1)); }

function canPlace(x, y, r) {
  for (const t of WORLD.trees) {
    if (Math.hypot(x - t.x, y - t.y) < (t.r + r) * 0.8) return false;
  }
  for (const h of WORLD.houses) {
    if (Math.abs(x - h.x) < h.w * 0.6 + r && Math.abs(y - h.y) < h.h * 0.6 + r) return false;
  }
  return true;
}

function generateWorld() {
  _seed = 98765;
  WORLD.trees = []; WORLD.houses = [];
  WORLD.grassPatches = []; WORLD.grassTufts = [];
  WORLD.flowers = []; WORLD.bushes = []; WORLD.rocks = []; WORLD.paths = [];

  for (let y = 100; y < WORLD.height - 100; y += 30) {
    const offsetX = Math.sin(y / 200) * 80;
    WORLD.paths.push({ x: WORLD.width / 2 + offsetX, y: y, w: 100, h: 40 });
  }
  for (let x = 100; x < WORLD.width - 100; x += 30) {
    const offsetY = Math.cos(x / 250) * 80;
    WORLD.paths.push({ x: x, y: WORLD.height / 2 + offsetY, w: 40, h: 100 });
  }

  for (let i = 0; i < 200; i++) {
    WORLD.grassPatches.push({
      x: rndRange(0, WORLD.width), y: rndRange(0, WORLD.height),
      r: rndRange(40, 120),
      tone: rnd() < 0.5 ? 'dark' : 'light'
    });
  }
  for (let i = 0; i < 800; i++) {
    WORLD.grassTufts.push({
      x: rndRange(0, WORLD.width), y: rndRange(0, WORLD.height),
      h: rndRange(4, 9)
    });
  }
  for (let i = 0; i < 250; i++) {
    WORLD.flowers.push({
      x: rndRange(0, WORLD.width), y: rndRange(0, WORLD.height),
      color: ['#e74c3c', '#f1c40f', '#ff69b4', '#ffffff', '#9b59b6'][rndInt(0, 4)]
    });
  }
  for (let i = 0; i < 60; i++) {
    WORLD.bushes.push({
      x: rndRange(100, WORLD.width - 100),
      y: rndRange(100, WORLD.height - 100),
      r: rndRange(14, 22)
    });
  }
  for (let i = 0; i < 50; i++) {
    WORLD.rocks.push({
      x: rndRange(100, WORLD.width - 100),
      y: rndRange(100, WORLD.height - 100),
      r: rndRange(8, 16)
    });
  }

  const houseSpots = [
    { x: 500,  y: 500  },
    { x: 2200, y: 450  },
    { x: 600,  y: 1700 },
    { x: 2200, y: 1750 },
    { x: 1400, y: 300  },
    { x: 1400, y: 1900 }
  ];
  houseSpots.forEach(p => {
    WORLD.houses.push({ x: p.x, y: p.y, w: 200, h: 200 });
  });

  for (let i = 0; i < 180; i++) {
    for (let tries = 0; tries < 20; tries++) {
      const x = rndRange(80, WORLD.width - 80);
      const y = rndRange(80, WORLD.height - 80);
      const r = rndRange(50, 80);
      if (Math.hypot(x - WORLD.width / 2, y - WORLD.height / 2) < 200) continue;
      if (canPlace(x, y, r)) {
        WORLD.trees.push({ x, y, r });
        break;
      }
    }
  }

  WORLD.trees.sort((a, b) => a.y - b.y);
  WORLD.bushes.sort((a, b) => a.y - b.y);
  WORLD.rocks.sort((a, b) => a.y - b.y);
}
generateWorld();

// ============================================================
//  Игрок (локальный)
// ============================================================
const player = {
  x: WORLD.width / 2,
  y: WORLD.height / 2,
  speed: 3.5,
  targetX: WORLD.width / 2,
  targetY: WORLD.height / 2,
  facing: false,
  frame: 0,
  animTimer: 0,
  moving: false,
  stepTimer: 0,
  animation: 'stand'
};

// Таймер для отправки своих координат (не каждый кадр — а раз в 100 мс)
let netSendTimer = 0;
const NET_SEND_INTERVAL = 100; // мс

const camera = { x: player.x, y: player.y };

// ============================================================
//  Управление
// ============================================================
const keys = {};

window.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

worldCanvas.addEventListener('click', e => {
  const rect = worldCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  player.targetX = mx - WW / 2 + camera.x;
  player.targetY = my - WH / 2 + camera.y + 30;
  if (player.animation !== 'walk') setAnimation('walk');
});

// ============================================================
//  Смена анимации (с отправкой в сеть)
// ============================================================
function setAnimation(anim) {
  const changed = (player.animation !== anim);
  player.animation = anim;
  player.frame = 0;

  document.querySelectorAll('#animBar .animBtn').forEach(b => {
    b.classList.toggle('active', b.dataset.anim === anim);
  });

  if (anim === 'sit')   Sound.sit();
  if (anim === 'dance') Sound.dance();
  if (anim === 'wave')  Sound.wave();
  if (anim === 'roar')  Sound.roar();

  // Отправляем в сеть, если анимация поменялась
  if (changed && typeof sendMyAnimation === 'function') {
    sendMyAnimation();
  }
}

document.querySelectorAll('#animBar .animBtn').forEach(b => {
  b.addEventListener('click', () => setAnimation(b.dataset.anim));
});

// ============================================================
//  Цикл мира
// ============================================================
let worldRunning = false;
let worldLastT = 0;

function startWorld() {
  resizeWorld();

  player.x = WORLD.width / 2;
  player.y = WORLD.height / 2;
  player.targetX = player.x;
  player.targetY = player.y;
  camera.x = player.x;
  camera.y = player.y;

  setAnimation('stand');

  worldRunning = true;
  worldLastT = performance.now();
  requestAnimationFrame(worldLoop);
}

function worldLoop(t) {
  if (!worldRunning || currentScreen !== 'worldScreen') return;
  const dt = t - worldLastT;
  worldLastT = t;
  updateWorld(dt, t);
  drawWorld();
  requestAnimationFrame(worldLoop);
}

// ============================================================
//  Обновление
// ============================================================
function updateWorld(dt, t) {
  const canMove = (player.animation !== 'sit');

  let dx = 0, dy = 0;
  if (canMove) {
    if (keys['w'] || keys['arrowup'])    dy -= 1;
    if (keys['s'] || keys['arrowdown'])  dy += 1;
    if (keys['a'] || keys['arrowleft'])  dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
  }

  player.moving = false;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed;
    player.y += (dy / len) * player.speed;
    player.targetX = player.x;
    player.targetY = player.y;
    player.moving = true;
    if (dx < 0) player.facing = true;
    else if (dx > 0) player.facing = false;
    if (player.animation === 'stand' || player.animation === 'sit') setAnimation('walk');
  } else if (canMove) {
    const tdx = player.targetX - player.x;
    const tdy = player.targetY - player.y;
    const dist = Math.hypot(tdx, tdy);
    if (dist > 2) {
      player.x += (tdx / dist) * player.speed;
      player.y += (tdy / dist) * player.speed;
      player.moving = true;
      if (tdx < 0) player.facing = true;
      else if (tdx > 0) player.facing = false;
      if (player.animation === 'stand' || player.animation === 'sit') setAnimation('walk');
    }
  }

  player.x = Math.max(60, Math.min(WORLD.width - 60, player.x));
  player.y = Math.max(60, Math.min(WORLD.height - 60, player.y));

  // Анимация
  if (player.moving) {
    if (t - player.animTimer > 130) {
      player.animTimer = t;
      player.frame = (player.frame + 1) % 6;
    }
    if (t - player.stepTimer > 260) {
      player.stepTimer = t;
      Sound.step();
    }
  } else {
    if (player.animation === 'walk') {
      setAnimation('stand');
    }
    if (player.animation === 'dance' || player.animation === 'wave' || player.animation === 'roar') {
      if (t - player.animTimer > 150) {
        player.animTimer = t;
        player.frame = (player.frame + 1) % 6;
      }
    } else {
      player.frame = 0;
    }
  }

  // ============================================================
  //  Отправляем свои координаты в сеть раз в NET_SEND_INTERVAL
  // ============================================================
  netSendTimer += dt;
  if (netSendTimer > NET_SEND_INTERVAL) {
    netSendTimer = 0;
    if (typeof sendMyPosition === 'function' && NET.connected) {
      sendMyPosition();
    }
  }

  // Камера
  camera.x += (player.x - camera.x) * 0.12;
  camera.y += (player.y - camera.y) * 0.12;

  const posEl = $('worldPos');
  if (posEl) posEl.textContent = Math.round(player.x) + ', ' + Math.round(player.y);
}

// ============================================================
//  Отрисовка
// ============================================================
function drawWorld() {
  wctx.fillStyle = '#c8b878';
  wctx.fillRect(0, 0, WW, WH);

  const offX = WW / 2 - camera.x;
  const offY = WH / 2 - camera.y;

  // Пятна травы
  for (const p of WORLD.grassPatches) {
    const sx = p.x + offX, sy = p.y + offY;
    if (sx < -150 || sx > WW + 150 || sy < -150 || sy > WH + 150) continue;
    wctx.fillStyle = p.tone === 'dark'
      ? 'rgba(120,160,90,0.35)'
      : 'rgba(220,240,160,0.35)';
    wctx.beginPath();
    wctx.ellipse(sx, sy, p.r, p.r * 0.6, 0, 0, Math.PI * 2);
    wctx.fill();
  }

  // Дорожки
  for (const p of WORLD.paths) {
    const sx = p.x + offX, sy = p.y + offY;
    if (sx < -200 || sx > WW + 200 || sy < -200 || sy > WH + 200) continue;
    wctx.fillStyle = '#d4b878';
    wctx.fillRect(sx - p.w / 2, sy - p.h / 2, p.w, p.h);
  }

  // Камни
  for (const r of WORLD.rocks) {
    const sx = r.x + offX, sy = r.y + offY;
    if (sx < -100 || sx > WW + 100 || sy < -100 || sy > WH + 100) continue;
    wctx.fillStyle = 'rgba(0,0,0,0.2)';
    wctx.beginPath();
    wctx.ellipse(sx, sy + r.r * 0.4, r.r * 0.9, r.r * 0.3, 0, 0, Math.PI * 2);
    wctx.fill();
    wctx.fillStyle = '#7a7a7a';
    wctx.beginPath(); wctx.arc(sx, sy, r.r, 0, Math.PI * 2); wctx.fill();
    wctx.fillStyle = '#9a9a9a';
    wctx.beginPath(); wctx.arc(sx - r.r * 0.25, sy - r.r * 0.25, r.r * 0.55, 0, Math.PI * 2); wctx.fill();
  }

  // Пучки травы
  wctx.strokeStyle = '#7a9a3a';
  wctx.lineWidth = 1;
  for (const t of WORLD.grassTufts) {
    const sx = t.x + offX, sy = t.y + offY;
    if (sx < -20 || sx > WW + 20 || sy < -20 || sy > WH + 20) continue;
    wctx.beginPath();
    wctx.moveTo(sx, sy);
    wctx.lineTo(sx - 2, sy - t.h);
    wctx.stroke();
    wctx.beginPath();
    wctx.moveTo(sx, sy);
    wctx.lineTo(sx + 2, sy - t.h);
    wctx.stroke();
  }

  // Цветы
  for (const f of WORLD.flowers) {
    const sx = f.x + offX, sy = f.y + offY;
    if (sx < -20 || sx > WW + 20 || sy < -20 || sy > WH + 20) continue;
    wctx.fillStyle = f.color;
    wctx.fillRect(sx - 2, sy - 2, 4, 4);
    wctx.fillStyle = '#ffd966';
    wctx.fillRect(sx - 1, sy - 1, 2, 2);
  }

  // Y-сортировка
  const renderables = [];

  WORLD.houses.forEach(h => {
    renderables.push({
      y: h.y + h.h * 0.3,
      draw: () => {
        const sx = h.x + offX;
        const sy = h.y + offY;
        if (sx < -300 || sx > WW + 300 || sy < -300 || sy > WH + 300) return;
        drawHouse(wctx, sx, sy, h.w, h.h);
      }
    });
  });

  WORLD.bushes.forEach(b => {
    renderables.push({
      y: b.y + b.r * 0.3,
      draw: () => {
        const sx = b.x + offX, sy = b.y + offY;
        if (sx < -100 || sx > WW + 100 || sy < -100 || sy > WH + 100) return;
        wctx.fillStyle = 'rgba(0,0,0,0.15)';
        wctx.beginPath();
        wctx.ellipse(sx, sy + b.r * 0.5, b.r * 0.9, b.r * 0.3, 0, 0, Math.PI * 2);
        wctx.fill();
        wctx.fillStyle = '#3a6b2a';
        wctx.beginPath(); wctx.arc(sx, sy, b.r, 0, Math.PI * 2); wctx.fill();
        wctx.fillStyle = '#5a8b3a';
        wctx.beginPath();
        wctx.arc(sx - b.r * 0.3, sy - b.r * 0.3, b.r * 0.6, 0, Math.PI * 2);
        wctx.fill();
      }
    });
  });

  WORLD.trees.forEach(t => {
    renderables.push({
      y: t.y + t.r * 0.3,
      draw: () => {
        const sx = t.x + offX, sy = t.y + offY;
        if (sx < -200 || sx > WW + 200 || sy < -250 || sy > WH + 250) return;
        drawTree(wctx, sx, sy, t.r);
      }
    });
  });

  // ============================================================
  //  ДРУГИЕ ИГРОКИ (из сети)
  // ============================================================
  if (typeof NET !== 'undefined' && NET.players) {
    NET.players.forEach(other => {
      renderables.push({
        y: other.y,
        draw: () => drawRemotePlayer(other, offX, offY)
      });
    });
  }

  // Локальный игрок
  renderables.push({
    y: player.y,
    draw: () => drawPlayer(offX, offY)
  });

  renderables.sort((a, b) => a.y - b.y);
  renderables.forEach(r => r.draw());
}

// ============================================================
//  Отрисовка локального игрока
// ============================================================
function drawPlayer(offX, offY) {
  const size = 96;
  const px = player.x + offX;
  const py = player.y + offY;

  drawDragonShadow(wctx, px, py + 6, size);

  if (dragonReady) {
    drawDragonSprite(
      wctx, px, py - 15, size,
      CONFIG.colorIndex, player.frame, player.facing
    );
  }

  wctx.save();
  wctx.font = 'bold 13px Trebuchet MS';
  wctx.textAlign = 'center';
  wctx.fillStyle = '#000';
  wctx.fillText(CONFIG.name, px + 1, py - 55 + 1);
  wctx.fillStyle = '#ffd966';
  wctx.fillText(CONFIG.name, px, py - 55);
  wctx.restore();
}

// ============================================================
//  Отрисовка удалённого игрока (из сети)
// ============================================================
function drawRemotePlayer(other, offX, offY) {
  const size = 96;
  const px = other.x + offX;
  const py = other.y + offY;

  // Не рисуем, если за экраном
  if (px < -100 || px > WW + 100 || py < -100 || py > WH + 100) return;

  drawDragonShadow(wctx, px, py + 6, size);

  if (dragonReady) {
    const colorIdx = (typeof other.colorIndex === 'number') ? other.colorIndex : 0;
    const frame = (typeof other.frame === 'number') ? other.frame : 0;
    const facing = !!other.facing;

    drawDragonSprite(
      wctx, px, py - 15, size,
      colorIdx, frame, facing
    );
  }

  // Имя над головой — другим цветом (голубоватый), чтобы отличать от себя
  const name = other.name || 'Дракон';
  wctx.save();
  wctx.font = 'bold 13px Trebuchet MS';
  wctx.textAlign = 'center';
  wctx.fillStyle = '#000';
  wctx.fillText(name, px + 1, py - 55 + 1);
  wctx.fillStyle = '#8fd8ff';
  wctx.fillText(name, px, py - 55);
  wctx.restore();
}

console.log('%c🌍 Часть 8 — мир с другими игроками готов', 'color:#4caf50;font-weight:bold');
</script>
<!-- ЧАСТЬ 8 ЗАКОНЧЕНА -->

<script>
// ============================================================
//  ЧАСТЬ 9: чат через WebSocket + финал
// ============================================================

// ---------- Состояние чата ----------
const chatState = {
  currentTab: 'local',     // local | global | system
  history: []
};

// ============================================================
//  Инициализация чата (UI)
// ============================================================
function initChat() {
  // Приветствие
  if (chatState.history.length === 0) {
    addChatMessage('sys', '', 'Добро пожаловать в DragonTown!');
    addChatMessage('sys', '', 'Нажми T — чтобы открыть чат, Enter — отправить.');
  }

  // Табы
  document.querySelectorAll('#chatTabs .tab').forEach(t => {
    t.addEventListener('click', () => {
      Sound.click();
      document.querySelectorAll('#chatTabs .tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      chatState.currentTab = t.dataset.chat;   // local | global | system
      renderChatHistory();
    });
  });

  // Отправка
  $('chatSend').addEventListener('click', sendChatMessage);
  $('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendChatMessage();
    }
  });
}

// ============================================================
//  Отправка сообщения (теперь через WebSocket!)
// ============================================================
function sendChatMessage() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;

  // Ограничение длины (как в Worker'е — 240 символов)
  if (text.length > 240) return;

  // Отправляем через сеть
  if (typeof sendChatToServer === 'function') {
    const ok = sendChatToServer(text, chatState.currentTab);
    if (!ok) {
      // Если сеть отвалилась — показываем локально
      addChatMessage('sys', '', 'Нет соединения с сервером. Сообщение не отправлено.');
    }
  }

  // Очищаем поле
  input.value = '';
  input.blur();
}

// ============================================================
//  Добавление сообщения в историю (локальное)
// ============================================================
function addChatMessage(type, nick, text, tab = 'local') {
  chatState.history.push({
    type, nick, text, tab,
    time: Date.now()
  });

  if (chatState.history.length > 100) {
    chatState.history.shift();
  }

  renderChatHistory();
}

// ============================================================
//  Приём сообщения из сети (вызывается из части 7)
// ============================================================
function addChatMessageFromNetwork(data) {
  // data = { id, name, text, tab, time }
  if (!data || !data.text) return;

  // Не показываем свои сообщения дважды (они уже добавлены локально при отправке)
  // Но сервер присылает свои тоже — поэтому проверяем:
  const isMine = (data.id === NET.myId);

  // Добавляем в историю
  chatState.history.push({
    type: 'user',
    nick: data.name || 'Дракон',
    text: data.text,
    tab: data.tab || 'local',
    time: data.time || Date.now(),
    isMine
  });

  if (chatState.history.length > 100) {
    chatState.history.shift();
  }

  renderChatHistory();

  // Звук при получении чужого сообщения
  if (!isMine) {
    Sound.chatMsg();
  }
}

// ============================================================
//  Отрисовка истории чата (вызывается при переключении табов)
// ============================================================
function renderChatHistory() {
  const box = $('chatHistory');
  if (!box) return;
  box.innerHTML = '';

  const visible = chatState.history.filter(m => {
    if (m.type === 'sys') return true;
    if (m.type === 'user' && m.isMine === undefined) return true; // локальные
    if (chatState.currentTab === 'local') {
      return m.tab === 'local';
    }
    return m.tab === chatState.currentTab;
  });

  visible.slice(-12).forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg' + (m.type === 'sys' ? ' sys' : '');

    if (m.type === 'sys') {
      div.textContent = m.text;
    } else {
      const tabPrefix = {
        local: '',
        global: '[G] ',
        system: '[S] '
      }[m.tab] || '';

      const nickStyle = m.isMine
        ? 'color:#ffd966'        // свой ник — жёлтый
        : 'color:#8fd8ff';       // чужой — голубой

      div.innerHTML = `<span class="nick" style="${nickStyle}">${tabPrefix}${escapeHtml(m.nick)}:</span> ${escapeHtml(m.text)}`;
    }

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

// ============================================================
//  Загрузка истории с сервера (при подключении)
// ============================================================
function renderChatFromNetwork(history) {
  if (!Array.isArray(history)) return;

  // Преобразуем серверные сообщения в наш формат
  history.forEach(msg => {
    if (!msg || !msg.text) return;
    chatState.history.push({
      type: 'user',
      nick: msg.name || 'Дракон',
      text: msg.text,
      tab: msg.tab || 'local',
      time: msg.time || Date.now(),
      isMine: (msg.id === NET.myId)
    });
  });

  // Ограничиваем
  if (chatState.history.length > 100) {
    chatState.history = chatState.history.slice(-100);
  }

  renderChatHistory();
}

// ============================================================
//  Экранирование HTML
// ============================================================
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ============================================================
//  Клавиша T — фокус на чат
// ============================================================
window.addEventListener('keydown', e => {
  if (currentScreen !== 'worldScreen') return;

  if (document.activeElement && document.activeElement.tagName === 'INPUT') {
    if (e.key === 'Escape') document.activeElement.blur();
    return;
  }

  if (e.key === 't' || e.key === 'T' || e.key === 'е' || e.key === 'Е') {
    e.preventDefault();
    $('chatInput').focus();
  }
});

// ============================================================
//  Пробел — рёв
// ============================================================
window.addEventListener('keydown', e => {
  if (currentScreen !== 'worldScreen') return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

  if (e.key === ' ') {
    e.preventDefault();
    setAnimation('roar');
    Sound.roar();
  }
});

// ============================================================
//  Escape — назад из редактора / серверов
// ============================================================
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (currentScreen === 'creatorScreen' || currentScreen === 'serverScreen') {
      Sound.click();
      show('mainMenu');
      renderMenuPreview();
    }
  }
});

// ============================================================
//  Запрет скролла страницы в мире
// ============================================================
document.addEventListener('wheel', e => {
  if (currentScreen === 'worldScreen') e.preventDefault();
}, { passive: false });

// ============================================================
//  Отключение от сервера при выходе из мира
// ============================================================
// (мы не имеем явной кнопки «выйти из мира», но если игрок
//  обновил страницу — WebSocket закроется сам)

// ============================================================
//  Финал
// ============================================================
window.addEventListener('load', () => {
  renderMenuPreview();
});

console.log('%c🐉 DragonTown — ONLINE ГОТОВО', 'color:#ff6b35;font-size:18px;font-weight:bold;text-shadow:1px 1px 2px #000');
console.log('%cУправление: WASD — движение · Клик — идти · T — чат · ПРОБЕЛ — рёв · ESC — назад', 'color:#ffd966');
console.log('%cМультиплеер: подключение к Cloudflare Worker через WebSocket', 'color:#8fd8ff');
</script>
