<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DragonTown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: 'Trebuchet MS', Tahoma, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .screen {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    overflow: hidden;
  }
  .hidden { display: none !important; }

  /* ============ ГЛАВНОЕ МЕНЮ ============ */
  #mainMenu {
    background: linear-gradient(180deg, #2a1a3e 0%, #1a1a2e 100%);
    padding: 20px;
  }
  .logo {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffd966;
    text-shadow:
      3px 3px 0 #8a4a1a,
      6px 6px 0 rgba(0,0,0,0.4),
      0 0 30px rgba(255,140,0,0.6);
    margin-bottom: 6px;
  }
  .logo .accent { color: #ff6b35; }
  .subtitle {
    color: #aaa;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .menuCharacterName {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 15px;
    color: #333;
    font-weight: bold;
    margin-bottom: 14px;
    min-width: 300px;
    justify-content: center;
    border: 2px solid #ffd966;
  }
  .menuCharacterName .badge {
    background: #ff6b35;
    color: #fff;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
  }
  .menuPreviewBox {
    background: #7ec87e;
    border-radius: 12px;
    padding: 6px;
    margin-bottom: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    border: 3px solid #8a4a1a;
  }
  #menuPreview { display: block; border-radius: 6px; }
  #playBtn {
    background: linear-gradient(180deg, #4caf50, #2e7d32);
    color: #fff;
    font-size: 19px;
    font-weight: bold;
    padding: 13px 60px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 #1b5e20, 0 6px 15px rgba(0,0,0,0.4);
    transition: transform 0.1s;
    margin-bottom: 12px;
  }
  #playBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b5e20; }
  #playBtn:hover { background: linear-gradient(180deg, #5cbf60, #388e3c); }
  .menuLinks { display: flex; gap: 20px; margin-top: 4px; }
  .menuLinks a {
    color: #ffd966;
    text-decoration: none;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px dashed #ffd966;
  }
  .menuLinks a:hover { color: #fff; }
  .rulesBox {
    position: absolute;
    bottom: 12px; left: 12px; right: 12px;
    color: #888;
    font-size: 11px;
    text-align: center;
    line-height: 1.5;
  }
  .rulesBox b { color: #ff6b35; }

  /* ============ СЕРВЕРА ============ */
  #serverScreen {
    background: #1a1a2e;
    padding: 15px;
    overflow-y: auto;
    justify-content: flex-start;
    padding-top: 25px;
  }
  #serverScreen h2 {
    color: #ffd966;
    font-size: 22px;
    margin-bottom: 15px;
    letter-spacing: 2px;
  }
  .serverTopBar {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 15px;
  }
  .serverTopBar input {
    flex: 1;
    background: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    color: #333;
    outline: none;
  }
  .serverTopBar button {
    background: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
  }
  .serverList {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
  }
  .serverItem {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 12px;
    border-bottom: 1px solid #333;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .serverItem:hover { background: #2a2a40; }
  .serverItem .flag { font-size: 24px; min-width: 32px; text-align: center; }
  .serverItem .info { flex: 1; text-align: left; }
  .serverItem .title { color: #fff; font-size: 15px; font-weight: bold; margin-bottom: 2px; }
  .serverItem .desc { color: #888; font-size: 12px; }
  .serverItem.adult .title { color: #ff6b35; }
  .serverItem.safe  .title { color: #6b9fff; }

  /* ============ РЕДАКТОР ============ */
  #creatorScreen {
    background: #2a2a2a;
    padding: 0;
    justify-content: flex-start;
    padding-top: 8px;
    overflow-y: auto;
  }
  .creatorTop {
    position: sticky; top: 0;
    width: 100%;
    background: #2a2a2a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    z-index: 20;
    gap: 8px;
  }
  .creatorTop button {
    background: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
  }
  .creatorTop button.primary {
    background: linear-gradient(180deg, #5cb85c, #4cae4c);
    color: #fff;
  }
  .creatorTabs {
    display: flex;
    gap: 2px;
    padding: 0 10px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .creatorTabs .tab {
    background: #3a3a3a;
    color: #ccc;
    padding: 7px 14px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .creatorTabs .tab.active { background: #ff6b35; color: #fff; }
  .previewArea {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a1a;
    padding: 10px 0;
    min-height: 280px;
  }
  #previewCanvas {
    background: #7ec87e;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
  }
  .creatorPanel {
    width: 100%;
    max-width: 560px;
    background: #1f1f1f;
    padding: 14px;
    margin: 10px auto;
    border-radius: 10px;
    color: #fff;
  }
  .creatorPanel .row {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #333;
  }
  .creatorPanel .row:last-child { border-bottom: none; }
  .creatorPanel label {
    display: block;
    font-size: 11px;
    color: #ff6b35;
    margin-bottom: 6px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: bold;
  }
  .colorGrid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .colorSwatch {
    aspect-ratio: 1;
    border-radius: 10px;
    cursor: pointer;
    border: 3px solid #555;
    transition: transform 0.15s;
    position: relative;
  }
  .colorSwatch:hover { transform: scale(1.08); }
  .colorSwatch.active {
    border-color: #fff;
    box-shadow: 0 0 0 3px #ff6b35, 0 0 20px rgba(255,107,53,0.8);
  }
  .nameInputGroup { display: flex; gap: 6px; }
  .nameInputGroup input {
    flex: 1;
    padding: 10px;
    background: #333;
    border: 2px solid #555;
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    outline: none;
  }

  /* ============ МИР ============ */
  #worldScreen { background: #c8b878; }
  #worldCanvas { display: block; }
  #worldUI {
    position: absolute; top: 10px; left: 10px;
    color: #fff;
    text-shadow: 1px 1px 2px #000;
    pointer-events: none;
    z-index: 5;
  }
  #worldUI .name { font-size: 16px; font-weight: bold; color: #ffd966; }
  #worldUI .pos { font-size: 12px; color: #ccc; }

  #animBar {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: rgba(0,0,0,0.6);
    padding: 6px 10px;
    border-radius: 12px;
    z-index: 6;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 96%;
  }
  #animBar .animBtn {
    width: 46px; height: 46px;
    background: #2a2a40;
    border: 2px solid #555;
    border-radius: 8px;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #animBar .animBtn:hover { background: #3a3a55; }
  #animBar .animBtn.active {
    background: #ff6b35;
    border-color: #fff;
  }

  #chatBox {
    position: absolute;
    bottom: 70px;
    left: 10px;
    width: 320px;
    max-width: 60%;
    z-index: 6;
    pointer-events: none;
  }
  #chatHistory {
    background: rgba(0,0,0,0.55);
    border-radius: 8px;
    padding: 6px 10px;
    color: #fff;
    font-size: 12px;
    max-height: 150px;
    overflow-y: auto;
    pointer-events: auto;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  #chatHistory .msg { margin-bottom: 3px; word-wrap: break-word; }
  #chatHistory .msg .nick { color: #ffd966; font-weight: bold; }
  #chatHistory .msg.sys { color: #aaa; font-style: italic; }
  #chatTabs {
    display: flex;
    gap: 4px;
    margin-bottom: 4px;
    pointer-events: auto;
  }
  #chatTabs .tab {
    background: rgba(0,0,0,0.55);
    color: #ccc;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    font-weight: bold;
  }
  #chatTabs .tab.active { background: #ff6b35; color: #fff; }
  #chatInputWrap {
    display: flex;
    gap: 4px;
    pointer-events: auto;
  }
  #chatInput {
    flex: 1;
    background: rgba(0,0,0,0.6);
    border: 2px solid #555;
    border-radius: 6px;
    padding: 6px 10px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  #chatInput::placeholder { color: #888; }
  #chatSend {
    background: #ff6b35;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
  }

  #soundBtn {
    position: absolute; top: 10px; right: 10px;
    width: 42px; height: 42px;
    background: rgba(0,0,0,0.6);
    border: 2px solid #ffd966;
    border-radius: 50%;
    color: #ffd966;
    font-size: 18px;
    cursor: pointer;
    z-index: 15;
    display: flex; align-items: center; justify-content: center;
  }
  #soundBtn.off { color: #666; border-color: #666; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  ::-webkit-scrollbar-thumb { background: #ff6b35; border-radius: 3px; }
</style>
<!-- ЧАСТЬ 1 ЗАКОНЧЕНА -->
</head>
<body>

<!-- ============ ЭКРАН 1: ГЛАВНОЕ МЕНЮ ============ -->
<div id="mainMenu" class="screen">
  <div class="logo">Dragon<span class="accent">Town</span></div>
  <div class="subtitle">социальный мир драконов</div>

  <div class="menuCharacterName" id="menuCharName">
    <span>🐉</span>
    <span id="menuNameText">Дракон</span>
    <span class="badge">RU</span>
  </div>

  <div class="menuPreviewBox">
    <canvas id="menuPreview" width="220" height="220"></canvas>
  </div>

  <button id="playBtn">▶ ИГРАТЬ</button>

  <div class="menuLinks">
    <a id="linkEdit">Редактор</a>
    <a id="linkRules">Правила</a>
  </div>

  <div class="rulesBox">
    <b>Правила:</b> не спамить · не использовать читы · уважать других игроков
  </div>
</div>

<!-- ============ ЭКРАН 2: ВЫБОР СЕРВЕРА ============ -->
<div id="serverScreen" class="screen hidden">
  <h2>🌐 ВЫБОР СЕРВЕРА</h2>

  <div class="serverTopBar">
    <input id="serverNameInput" maxlength="16" value="Дракон" placeholder="Имя дракона">
    <button id="serverBackBtn">← Назад</button>
  </div>

  <div class="serverList" id="serverList"></div>
</div>

<!-- ============ ЭКРАН 3: РЕДАКТОР ДРАКОНА ============ -->
<div id="creatorScreen" class="screen hidden">

  <div class="creatorTop">
    <button id="creatorBackBtn">← Назад</button>
    <div style="color:#fff;font-weight:bold;letter-spacing:1px;font-size:13px">РЕДАКТОР ДРАКОНА</div>
    <button id="creatorSaveBtn" class="primary">Сохранить</button>
  </div>

  <div class="creatorTabs" id="creatorTabs">
    <div class="tab active" data-tab="color">ЦВЕТ</div>
    <div class="tab" data-tab="anim">АНИМАЦИЯ</div>
    <div class="tab" data-tab="name">ИМЯ</div>
  </div>

  <div class="previewArea">
    <canvas id="previewCanvas" width="300" height="300"></canvas>
  </div>

  <div class="creatorPanel" id="creatorPanel"></div>

</div>

<!-- ============ ЭКРАН 4: МИР ============ -->
<div id="worldScreen" class="screen hidden">
  <canvas id="worldCanvas"></canvas>

  <div id="worldUI">
    <div class="name" id="worldName">Дракон</div>
    <div class="pos">Позиция: <span id="worldPos">0, 0</span></div>
  </div>

  <div id="soundBtn" title="Звук">🔊</div>

  <!-- Панель анимаций -->
  <div id="animBar">
    <div class="animBtn active" data-anim="stand" title="Стоять">🧍</div>
    <div class="animBtn" data-anim="walk" title="Идти">🚶</div>
    <div class="animBtn" data-anim="sit" title="Сидеть">🪑</div>
    <div class="animBtn" data-anim="dance" title="Танцевать">💃</div>
    <div class="animBtn" data-anim="wave" title="Махать">👋</div>
    <div class="animBtn" data-anim="roar" title="Рёв">🦁</div>
  </div>

  <!-- Чат -->
  <div id="chatBox">
    <div id="chatHistory"></div>
    <div id="chatTabs">
      <div class="tab active" data-chat="local">Local</div>
      <div class="tab" data-chat="party">Party</div>
      <div class="tab" data-chat="personal">Personal</div>
    </div>
    <div id="chatInputWrap">
      <input id="chatInput" maxlength="120" placeholder="Написать сообщение...">
      <button id="chatSend">→</button>
    </div>
  </div>
</div>

<!-- ЧАСТЬ 2 ЗАКОНЧЕНА -->
<script>
// ============================================================
//  DragonTown — Beta 7
//  ЧАСТЬ 3: состояние + звук + утилиты
// ============================================================

// ---------- Конфиг персонажа ----------
// Цвета больше не перекрашиваются — выбирается ГОТОВЫЙ спрайт
// По индексу: 0=красный, 1=оранжевый, ..., 9=чёрный
const CONFIG = {
  name: 'Дракон',
  colorIndex: 0,        // индекс цвета (0..9)
  animation: 'stand'    // stand | walk | sit | dance | wave | roar
};

// ---------- Названия цветов (для редактора) ----------
const COLOR_NAMES = [
  'Красный', 'Оранжевый', 'Жёлтый', 'Зелёный', 'Бирюзовый',
  'Синий', 'Фиолетовый', 'Розовый', 'Белый', 'Чёрный'
];

// ---------- Цвета для кнопок-кружков (приблизительные) ----------
const COLOR_SWATCH = [
  '#c02020',   // красный
  '#e08020',   // оранжевый
  '#f0c040',   // жёлтый
  '#40a040',   // зелёный
  '#40b0b0',   // бирюзовый
  '#4080d0',   // синий
  '#8050b0',   // фиолетовый
  '#e04080',   // розовый
  '#f0f0e0',   // белый
  '#303030'    // чёрный
];

// ---------- Текущий экран ----------
let currentScreen = 'mainMenu';

// ---------- Утилиты ----------
function $(id) { return document.getElementById(id); }

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
  currentScreen = id;
}

// Затемнение/осветление hex-цвета (для UI)
function shade(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00ff) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000ff) + amt));
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

// ============================================================
//  ЗВУК (Web Audio API)
// ============================================================
const Sound = (() => {
  let ctxA = null;
  let enabled = true;
  let ambientGain = null;
  let ambientStarted = false;

  function ensure() {
    if (!ctxA) {
      try {
        ctxA = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { return null; }
    }
    if (ctxA.state === 'suspended') ctxA.resume();
    return ctxA;
  }

  function beep(freq, duration, type = 'square', volume = 0.06) {
    const c = ensure(); if (!c || !enabled) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(volume, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + duration + 0.01);
  }

  function click() { beep(660, 0.08, 'square', 0.06); }
  function hover() { beep(880, 0.05, 'sine', 0.025); }

  function step() {
    const c = ensure(); if (!c || !enabled) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180 + Math.random() * 40, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(60, c.currentTime + 0.08);
    g.gain.setValueAtTime(0.03, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.1);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.11);
  }

  function sit() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(440, t);
    o.frequency.exponentialRampToValueAtTime(220, t + 0.35);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.45);
  }

  function dance() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const notes = [523, 659, 784, 1046, 784, 659];
    notes.forEach((fr, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(fr, t + i * 0.08);
      g.gain.setValueAtTime(0.0001, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.07, t + i * 0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.15);
      o.connect(g); g.connect(c.destination);
      o.start(t + i * 0.08);
      o.stop(t + i * 0.08 + 0.18);
    });
  }

  function wave() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(1200, t + 0.18);
    o.frequency.exponentialRampToValueAtTime(800, t + 0.28);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.35);
  }

  function roar() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const o1 = c.createOscillator();
    const o2 = c.createOscillator();
    const g = c.createGain();
    const f = c.createBiquadFilter();
    o1.type = 'sawtooth';
    o2.type = 'square';
    o1.frequency.setValueAtTime(95, t);
    o1.frequency.linearRampToValueAtTime(60, t + 0.7);
    o2.frequency.setValueAtTime(48, t);
    o2.frequency.linearRampToValueAtTime(32, t + 0.7);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(200, t + 0.7);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(c.destination);
    o1.start(t); o2.start(t);
    o1.stop(t + 0.8); o2.stop(t + 0.8);
  }

  function enterWorld() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    [440, 550, 660, 880].forEach((fr, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(fr, t + i * 0.08);
      g.gain.setValueAtTime(0.0001, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.06, t + i * 0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.25);
      o.connect(g); g.connect(c.destination);
      o.start(t + i * 0.08);
      o.stop(t + i * 0.08 + 0.28);
    });
  }

  function save() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    [520, 780].forEach((fr, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(fr, t + i * 0.1);
      g.gain.setValueAtTime(0.0001, t + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.08, t + i * 0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.2);
      o.connect(g); g.connect(c.destination);
      o.start(t + i * 0.1);
      o.stop(t + i * 0.1 + 0.22);
    });
  }

  function chatMsg() {
    beep(880, 0.06, 'sine', 0.04);
    setTimeout(() => beep(1100, 0.06, 'sine', 0.03), 60);
  }

  function startAmbient() {
    const c = ensure(); if (!c || !enabled || ambientStarted) return;
    ambientStarted = true;
    const bufferSize = 2 * c.sampleRate;
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 320;
    ambientGain = c.createGain();
    ambientGain.gain.value = 0.012;
    noise.connect(filter); filter.connect(ambientGain); ambientGain.connect(c.destination);
    noise.start();
  }

  function toggle() {
    enabled = !enabled;
    if (ambientGain) ambientGain.gain.value = enabled ? 0.012 : 0;
    return enabled;
  }

  return {
    click, hover, step,
    sit, dance, wave, roar,
    enterWorld, save, chatMsg,
    startAmbient, toggle, ensure
  };
})();

<script>
// ============================================================
//  ЧАСТЬ 4: загрузка спрайт-сетки 10×6, удаление шахматки,
//  нарезка на 60 кадров (10 цветов × 6 кадров анимации)
// ============================================================

const SpriteAssets = {
  images: {},
  frames: {},      // frames.walk[colorIndex][frameIndex] = canvas
  loaded: 0,
  total: 0,
  ready: false,
  onReadyCallbacks: []
};

function loadImage(name, src) {
  return new Promise((resolve) => {
    SpriteAssets.total++;
    const img = new Image();
    img.onload = () => {
      SpriteAssets.images[name] = img;
      SpriteAssets.loaded++;
      resolve(img);
    };
    img.onerror = () => {
      console.error('Не загрузилось:', src);
      resolve(null);
    };
    img.src = src;
  });
}

// ============================================================
//  УДАЛЕНИЕ ШАХМАТКИ (светло-серый + белый)
//  Работает через getImageData. Если CORS — не сработает,
//  но тогда фон останется серым.
// ============================================================
function removeCheckerboard(img) {
  const c = document.createElement('canvas');
  c.width = img.width;
  c.height = img.height;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(img, 0, 0);

  let imgData;
  try {
    imgData = g.getImageData(0, 0, img.width, img.height);
  } catch (e) {
    console.warn('CORS блокирует getImageData, фон не удалён');
    return c;
  }

  const data = imgData.data;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const gg = data[i + 1];
    const b = data[i + 2];
    const a = data[i + 3];
    if (a < 10) continue;

    // Определяем «шахматку» — очень светлые серые пиксели
    // Шахматка обычно #cccccc и #ffffff, но с антиалиасингом
    // от 190 до 255 по всем каналам, при этом почти нейтрально-серая
    const max = Math.max(r, gg, b);
    const min = Math.min(r, gg, b);
    const diff = max - min;

    // Нейтральный (серый/белый) и светлый
    if (diff < 12 && min >= 185) {
      data[i + 3] = 0; // делаем прозрачным
    }
  }

  g.putImageData(imgData, 0, 0);
  return c;
}

// ============================================================
//  НАРЕЗКА СЕТКИ 10×6 НА 60 СПРАЙТОВ
//  rows = 10 (цвета)
//  cols = 6 (кадры анимации)
// ============================================================
function sliceGrid(img, rows, cols, targetH = 96) {
  const grid = []; // grid[row][col] = canvas

  const cellW = img.width / cols;
  const cellH = img.height / rows;

  const aspect = cellW / cellH;
  const targetW = Math.round(targetH * aspect);

  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let col = 0; col < cols; col++) {
      const c = document.createElement('canvas');
      c.width = targetW;
      c.height = targetH;
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = false;

      g.drawImage(
        img,
        col * cellW, r * cellH, cellW, cellH,
        0, 0, targetW, targetH
      );
      row.push(c);
    }
    grid.push(row);
  }

  return grid;
}

// ============================================================
//  ЗАГРУЗКА ВСЕХ СПРАЙТОВ
// ============================================================
async function loadAllSprites() {
  // Загружаем большие картинки (дерево, дом, трава)
  const simples = [
    { name: 'tree',  src: 'tree.png',  h: 140 },
    { name: 'house', src: 'house.png', h: 200 },
    { name: 'grass', src: 'grass.png', h: 128 }
  ];

  for (const a of simples) {
    const img = await loadImage(a.name, a.src);
    if (img) {
      // Убираем шахматку и уменьшаем
      const cleaned = removeCheckerboard(img);
      const c = document.createElement('canvas');
      c.width = a.h;
      c.height = a.h;
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = false;
      // Сохраняем пропорции
      const aspect = cleaned.width / cleaned.height;
      const w = a.h * aspect;
      g.drawImage(cleaned, (a.h - w) / 2, 0, w, a.h);
      SpriteAssets.frames[a.name] = [c];
    }
  }

  // Загружаем сетку 10×6 с драконами
  const walkImg = await loadImage('walkGrid', 'dragon_colors_walk.png');
  if (walkImg) {
    const cleaned = removeCheckerboard(walkImg);
    // Нарезаем 10 строк × 6 колонок
    SpriteAssets.frames.walk = sliceGrid(cleaned, 10, 6, 96);
  }

  SpriteAssets.ready = true;
  SpriteAssets.onReadyCallbacks.forEach(cb => cb());
  console.log('%c✅ Спрайты загружены (10 цветов × 6 кадров)', 'color:#4caf50;font-weight:bold');
}

function onSpritesReady(cb) {
  if (SpriteAssets.ready) cb();
  else SpriteAssets.onReadyCallbacks.push(cb);
}

// ---------- Стартуем загрузку сразу ----------
loadAllSprites();

// ============================================================
//  ОТРИСОВКА ДРАКОНА
//  anim: 'walk' (пока только walk есть)
//  colorIndex: 0..9
//  frame: 0..5
// ============================================================
function drawDragonAnim(ctx, cx, cy, size, colorIndex, frame, facing) {
  if (!SpriteAssets.ready) return;
  const grid = SpriteAssets.frames.walk;
  if (!grid || !grid[colorIndex]) return;

  const frames = grid[colorIndex];
  frame = ((frame % frames.length) + frames.length) % frames.length;
  const sprite = frames[frame];

  const aspect = sprite.width / sprite.height;
  const drawH = size;
  const drawW = size * aspect;

  ctx.save();
  ctx.imageSmoothingEnabled = false;

  if (facing) {
    ctx.translate(cx, cy);
    ctx.scale(-1, 1);
    ctx.drawImage(sprite, -drawW / 2, -drawH / 2, drawW, drawH);
  } else {
    ctx.drawImage(sprite, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
  }

  ctx.restore();
}

// Тень под драконом
function drawDragonShadow(ctx, cx, cy, size) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, cy, size * 0.20, size * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();
}

//  Трава-паттерн, деревья, дома, дракон с 10 цветами
//  Всё через drawImage — без лагов
// ============================================================

const worldCanvas = $('worldCanvas');
const wctx = worldCanvas.getContext('2d');
wctx.imageSmoothingEnabled = false;

let WW = window.innerWidth;
let WH = window.innerHeight;

function resizeWorld() {
  WW = window.innerWidth;
  WH = window.innerHeight;
  worldCanvas.width = WW;
  worldCanvas.height = WH;
  wctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', () => {
  if (currentScreen === 'worldScreen') resizeWorld();
});

// ============================================================
//  Мир
// ============================================================
const WORLD = {
  width: 2800,
  height: 2200,
  trees: [],
  houses: []
};

// Детерминированный рандом
let _seed = 98765;
function rnd() {
  _seed = (_seed * 9301 + 49297) % 233280;
  return _seed / 233280;
}
function rndRange(a, b) { return a + rnd() * (b - a); }

function canPlace(x, y, r) {
  for (const t of WORLD.trees) {
    if (Math.hypot(x - t.x, y - t.y) < (t.r + r) * 0.8) return false;
  }
  for (const h of WORLD.houses) {
    if (Math.abs(x - h.x) < h.w * 0.6 + r && Math.abs(y - h.y) < h.h * 0.6 + r) return false;
  }
  return true;
}

function generateWorld() {
  _seed = 98765;
  WORLD.trees = [];
  WORLD.houses = [];

  const houseSpots = [
    { x: 500,  y: 500  },
    { x: 2200, y: 450  },
    { x: 600,  y: 1700 },
    { x: 2200, y: 1750 },
    { x: 1400, y: 300  },
    { x: 1400, y: 1900 }
  ];
  houseSpots.forEach(p => {
    WORLD.houses.push({ x: p.x, y: p.y, w: 200, h: 200 });
  });

  for (let i = 0; i < 180; i++) {
    for (let tries = 0; tries < 20; tries++) {
      const x = rndRange(80, WORLD.width - 80);
      const y = rndRange(80, WORLD.height - 80);
      const r = rndRange(50, 80);
      if (Math.hypot(x - WORLD.width / 2, y - WORLD.height / 2) < 150) continue;
      if (canPlace(x, y, r)) {
        WORLD.trees.push({ x, y, r });
        break;
      }
    }
  }

  WORLD.trees.sort((a, b) => a.y - b.y);
}

generateWorld();

// ============================================================
//  Фон-паттерн травы
// ============================================================
let grassPattern = null;

function initGrassPattern() {
  if (!SpriteAssets.ready || !SpriteAssets.frames.grass) return;
  const tile = SpriteAssets.frames.grass[0];
  const small = document.createElement('canvas');
  small.width = 128;
  small.height = 128;
  const sg = small.getContext('2d');
  sg.imageSmoothingEnabled = false;
  sg.drawImage(tile, 0, 0, tile.width, tile.height, 0, 0, 128, 128);
  grassPattern = wctx.createPattern(small, 'repeat');
}
onSpritesReady(initGrassPattern);

// ============================================================
//  Игрок
// ============================================================
const player = {
  x: WORLD.width / 2,
  y: WORLD.height / 2,
  speed: 3.5,
  targetX: WORLD.width / 2,
  targetY: WORLD.height / 2,
  facing: false,
  frame: 0,
  animTimer: 0,
  moving: false,
  stepTimer: 0,
  animation: 'stand'
};

const camera = { x: player.x, y: player.y };

// ============================================================
//  Управление
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

worldCanvas.addEventListener('click', e => {
  const rect = worldCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  player.targetX = mx - WW / 2 + camera.x;
  player.targetY = my - WH / 2 + camera.y + 30;
  if (player.animation !== 'walk') setAnimation('walk');
});

// ============================================================
//  Смена анимации
// ============================================================
function setAnimation(anim) {
  player.animation = anim;
  player.frame = 0;
  document.querySelectorAll('#animBar .animBtn').forEach(b => {
    b.classList.toggle('active', b.dataset.anim === anim);
  });
  if (anim === 'sit')   Sound.sit();
  if (anim === 'dance') Sound.dance();
  if (anim === 'wave')  Sound.wave();
  if (anim === 'roar')  Sound.roar();
}

document.querySelectorAll('#animBar .animBtn').forEach(b => {
  b.addEventListener('click', () => {
    setAnimation(b.dataset.anim);
  });
});

// ============================================================
//  Цикл мира
// ============================================================
let worldRunning = false;
let worldLastT = 0;

function startWorld() {
  resizeWorld();
  initGrassPattern();
  player.x = WORLD.width / 2;
  player.y = WORLD.height / 2;
  player.targetX = player.x;
  player.targetY = player.y;
  camera.x = player.x;
  camera.y = player.y;
  setAnimation('stand');
  worldRunning = true;
  worldLastT = performance.now();
  requestAnimationFrame(worldLoop);
}

function worldLoop(t) {
  if (!worldRunning || currentScreen !== 'worldScreen') return;
  const dt = t - worldLastT;
  worldLastT = t;
  updateWorld(dt, t);
  drawWorld();
  requestAnimationFrame(worldLoop);
}

// ============================================================
//  Обновление
// ============================================================
function updateWorld(dt, t) {
  const canMove = (player.animation !== 'sit');

  let dx = 0, dy = 0;
  if (canMove) {
    if (keys['w'] || keys['arrowup'])    dy -= 1;
    if (keys['s'] || keys['arrowdown'])  dy += 1;
    if (keys['a'] || keys['arrowleft'])  dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
  }

  player.moving = false;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed;
    player.y += (dy / len) * player.speed;
    player.targetX = player.x;
    player.targetY = player.y;
    player.moving = true;
    if (dx < 0) player.facing = true;
    else if (dx > 0) player.facing = false;
    if (player.animation === 'stand' || player.animation === 'sit') {
      setAnimation('walk');
    }
  } else if (canMove) {
    const tdx = player.targetX - player.x;
    const tdy = player.targetY - player.y;
    const dist = Math.hypot(tdx, tdy);
    if (dist > 2) {
      player.x += (tdx / dist) * player.speed;
      player.y += (tdy / dist) * player.speed;
      player.moving = true;
      if (tdx < 0) player.facing = true;
      else if (tdx > 0) player.facing = false;
      if (player.animation === 'stand' || player.animation === 'sit') {
        setAnimation('walk');
      }
    }
  }

  player.x = Math.max(60, Math.min(WORLD.width - 60, player.x));
  player.y = Math.max(60, Math.min(WORLD.height - 60, player.y));

  // Анимация — всегда крутим кадры ходьбы
  if (player.moving) {
    if (t - player.animTimer > 130) {
      player.animTimer = t;
      player.frame = (player.frame + 1) % 6;
    }
    if (t - player.stepTimer > 260) {
      player.stepTimer = t;
      Sound.step();
    }
  } else {
    // Стоит — медленная смена кадров
    if (t - player.animTimer > 400) {
      player.animTimer = t;
      player.frame = (player.frame + 1) % 6;
    }
  }

  camera.x += (player.x - camera.x) * 0.12;
  camera.y += (player.y - camera.y) * 0.12;

  $('worldPos').textContent = Math.round(player.x) + ', ' + Math.round(player.y);
}

// ============================================================
//  Отрисовка
// ============================================================
function drawWorld() {
  if (grassPattern) {
    wctx.fillStyle = grassPattern;
    wctx.fillRect(0, 0, WW, WH);
  } else {
    wctx.fillStyle = '#c8b878';
    wctx.fillRect(0, 0, WW, WH);
  }

  const offX = WW / 2 - camera.x;
  const offY = WH / 2 - camera.y;

  // Дома
  if (SpriteAssets.ready && SpriteAssets.frames.house) {
    const houseImg = SpriteAssets.frames.house[0];
    for (const h of WORLD.houses) {
      const sx = h.x + offX;
      const sy = h.y + offY;
      if (sx < -300 || sx > WW + 300 || sy < -300 || sy > WH + 300) continue;
      const dw = houseImg.width;
      const dh = houseImg.height;
      wctx.drawImage(houseImg, Math.round(sx - dw / 2), Math.round(sy - dh), dw, dh);
    }
  }

  // Деревья
  if (SpriteAssets.ready && SpriteAssets.frames.tree) {
    const treeImg = SpriteAssets.frames.tree[0];
    for (const t of WORLD.trees) {
      const sx = t.x + offX;
      const sy = t.y + offY;
      if (sx < -200 || sx > WW + 200 || sy < -250 || sy > WH + 250) continue;
      const dw = treeImg.width;
      const dh = treeImg.height;
      wctx.drawImage(treeImg, Math.round(sx - dw / 2), Math.round(sy - dh), dw, dh);
    }
  }

  // Игрок
  drawPlayer(offX, offY);
}

// ============================================================
//  Игрок
// ============================================================
function drawPlayer(offX, offY) {
  const size = 110;
  const px = player.x + offX;
  const py = player.y + offY;

  drawDragonShadow(wctx, px, py + 8, size);
  drawDragonAnim(wctx, px, py - 20, size, CONFIG.colorIndex, player.frame, player.facing);

  // Имя
  wctx.save();
  wctx.font = 'bold 13px Trebuchet MS';
  wctx.textAlign = 'center';
  wctx.fillStyle = '#000';
  wctx.fillText(CONFIG.name, px + 1, py - 75 + 1);
  wctx.fillStyle = '#ffd966';
  wctx.fillText(CONFIG.name, px, py - 75);
  wctx.restore();

  // Значки для анимаций
  if (player.animation === 'dance') {
    wctx.font = '22px Trebuchet MS';
    wctx.textAlign = 'center';
    wctx.fillText('💃', px, py - 90);
  } else if (player.animation === 'roar') {
    wctx.font = '22px Trebuchet MS';
    wctx.textAlign = 'center';
    wctx.fillText('💢', px, py - 90);
  } else if (player.animation === 'wave') {
    wctx.font = '22px Trebuchet MS';
    wctx.textAlign = 'center';
    wctx.fillText('👋', px + 30, py - 85);
  } else if (player.animation === 'sit') {
    wctx.font = '22px Trebuchet MS';
    wctx.textAlign = 'center';
    wctx.fillText('💤', px, py - 90);
  }
}

console.log('%c🌍 Мир готов', 'color:#4caf50;font-weight:bold');
</script>
<!-- ЧАСТЬ 7 ЗАКОНЧЕНА -->
<script>
// ============================================================
//  ЧАСТЬ 8: чат + финал
// ============================================================

// ---------- Состояние чата ----------
const chatState = {
  currentTab: 'local',
  history: []
};

// ---------- Инициализация ----------
function initChat() {
  addChatMessage('sys', '', 'Добро пожаловать в DragonTown!');

  document.querySelectorAll('#chatTabs .tab').forEach(t => {
    t.addEventListener('click', () => {
      Sound.click();
      document.querySelectorAll('#chatTabs .tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      chatState.currentTab = t.dataset.chat;
      renderChatHistory();
    });
  });

  $('chatSend').addEventListener('click', sendChatMessage);
  $('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendChatMessage();
    }
  });
}

// ---------- Отправка ----------
function sendChatMessage() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;
  addChatMessage('user', CONFIG.name, text, chatState.currentTab);
  input.value = '';
  input.blur();
}

// ---------- Добавление ----------
function addChatMessage(type, nick, text, tab = 'local') {
  chatState.history.push({ type, nick, text, tab, time: Date.now() });
  if (chatState.history.length > 50) chatState.history.shift();
  renderChatHistory();
  if (type === 'user' && nick !== CONFIG.name) Sound.chatMsg();
}

// ---------- Отрисовка истории ----------
function renderChatHistory() {
  const box = $('chatHistory');
  box.innerHTML = '';

  const visible = chatState.history.filter(m => {
    if (m.type === 'sys') return true;
    if (chatState.currentTab === 'local') return m.tab === 'local' || !m.tab;
    return m.tab === chatState.currentTab;
  });

  const recent = visible.slice(-12);

  recent.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg' + (m.type === 'sys' ? ' sys' : '');
    if (m.type === 'sys') {
      div.textContent = m.text;
    } else {
      const tabPrefix = { local: '', party: '[P] ', personal: '[→] ' }[m.tab] || '';
      div.innerHTML = `<span class="nick">${tabPrefix}${escapeHtml(m.nick)}:</span> ${escapeHtml(m.text)}`;
    }
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ---------- T — фокус на чат ----------
window.addEventListener('keydown', e => {
  if (currentScreen !== 'worldScreen') return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') {
    if (e.key === 'Escape') document.activeElement.blur();
    return;
  }
  if (e.key === 't' || e.key === 'T' || e.key === 'е' || e.key === 'Е') {
    e.preventDefault();
    $('chatInput').focus();
  }
});

// ============================================================
//  Финал
// ============================================================
window.addEventListener('load', () => {
  onSpritesReady(() => {
    renderPreview();
    renderMenuPreview();
  });
});

// Escape — назад из редактора / серверов
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (currentScreen === 'creatorScreen' || currentScreen === 'serverScreen') {
      Sound.click();
      show('mainMenu');
      renderMenuPreview();
    }
  }
});

// Скролл не двигает страницу
document.addEventListener('wheel', e => {
  if (currentScreen === 'worldScreen') e.preventDefault();
}, { passive: false });

console.log('%c🐉 DragonTown Beta 7 — ГОТОВО', 'color:#ff6b35;font-size:18px;font-weight:bold');
console.log('%cУправление: WASD · Клик · T — чат · ПРОБЕЛ — рёв · ESC — назад', 'color:#ffd966');

</script>
