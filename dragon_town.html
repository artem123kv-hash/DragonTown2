<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DragonTown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: 'Trebuchet MS', Tahoma, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .screen {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    overflow: hidden;
  }
  .hidden { display: none !important; }

  /* ============ ГЛАВНОЕ МЕНЮ ============ */
  #mainMenu {
    background: linear-gradient(180deg, #2a1a3e 0%, #1a1a2e 100%);
    padding: 20px;
  }
  .logo {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffd966;
    text-shadow:
      3px 3px 0 #8a4a1a,
      6px 6px 0 rgba(0,0,0,0.4),
      0 0 30px rgba(255,140,0,0.6);
    margin-bottom: 6px;
  }
  .logo .accent { color: #ff6b35; }
  .subtitle {
    color: #aaa;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .menuCharacterName {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 15px;
    color: #333;
    font-weight: bold;
    margin-bottom: 14px;
    min-width: 300px;
    justify-content: center;
    border: 2px solid #ffd966;
  }
  .menuCharacterName .badge {
    background: #ff6b35;
    color: #fff;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
  }
  .menuPreviewBox {
    background: #7ec87e;
    border-radius: 12px;
    padding: 6px;
    margin-bottom: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    border: 3px solid #8a4a1a;
  }
  #menuPreview { display: block; background: transparent; border-radius: 6px; }
  #playBtn {
    background: linear-gradient(180deg, #4caf50, #2e7d32);
    color: #fff;
    font-size: 19px;
    font-weight: bold;
    padding: 13px 60px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 #1b5e20, 0 6px 15px rgba(0,0,0,0.4);
    transition: transform 0.1s;
    margin-bottom: 12px;
  }
  #playBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b5e20; }
  #playBtn:hover { background: linear-gradient(180deg, #5cbf60, #388e3c); }
  .menuLinks { display: flex; gap: 20px; margin-top: 4px; }
  .menuLinks a {
    color: #ffd966;
    text-decoration: none;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px dashed #ffd966;
  }
  .menuLinks a:hover { color: #fff; }
  .rulesBox {
    position: absolute;
    bottom: 12px; left: 12px; right: 12px;
    color: #888;
    font-size: 11px;
    text-align: center;
    line-height: 1.5;
  }
  .rulesBox b { color: #ff6b35; }

  /* ============ СЕРВЕРА ============ */
  #serverScreen {
    background: #1a1a2e;
    padding: 15px;
    overflow-y: auto;
    justify-content: flex-start;
    padding-top: 25px;
  }
  #serverScreen h2 {
    color: #ffd966;
    font-size: 22px;
    margin-bottom: 15px;
    letter-spacing: 2px;
  }
  .serverTopBar {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 15px;
  }
  .serverTopBar input {
    flex: 1;
    background: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    color: #333;
    outline: none;
  }
  .serverTopBar button {
    background: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
  }
  .serverList {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
  }
  .serverItem {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 12px;
    border-bottom: 1px solid #333;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .serverItem:hover { background: #2a2a40; }
  .serverItem .flag { font-size: 24px; min-width: 32px; text-align: center; }
  .serverItem .info { flex: 1; text-align: left; }
  .serverItem .title { color: #fff; font-size: 15px; font-weight: bold; margin-bottom: 2px; }
  .serverItem .desc { color: #888; font-size: 12px; }
  .serverItem.adult .title { color: #ff6b35; }
  .serverItem.safe  .title { color: #6b9fff; }

  /* ============ РЕДАКТОР ============ */
  #creatorScreen {
    background: #2a2a2a;
    padding: 0;
    justify-content: flex-start;
    padding-top: 8px;
    overflow-y: auto;
  }
  .creatorTop {
    position: sticky; top: 0;
    width: 100%;
    background: #2a2a2a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    z-index: 20;
    gap: 8px;
  }
  .creatorTop button {
    background: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
  }
  .creatorTop button.primary {
    background: linear-gradient(180deg, #5cb85c, #4cae4c);
    color: #fff;
  }
  .creatorTabs {
    display: flex;
    gap: 2px;
    padding: 0 10px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .creatorTabs .tab {
    background: #3a3a3a;
    color: #ccc;
    padding: 7px 14px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .creatorTabs .tab.active { background: #ff6b35; color: #fff; }
  .previewArea {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a1a;
    padding: 10px 0;
    min-height: 280px;
  }
  #previewCanvas {
    background: #7ec87e;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
  }
  .creatorPanel {
    width: 100%;
    max-width: 560px;
    background: #1f1f1f;
    padding: 14px;
    margin: 10px auto;
    border-radius: 10px;
    color: #fff;
  }
  .creatorPanel .row {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #333;
  }
  .creatorPanel .row:last-child { border-bottom: none; }
  .creatorPanel label {
    display: block;
    font-size: 11px;
    color: #ff6b35;
    margin-bottom: 6px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: bold;
  }
  .creatorPanel .opts { display: flex; gap: 5px; flex-wrap: wrap; }
  .creatorPanel .opt {
    padding: 7px 11px;
    background: #3a3a3a;
    border: 2px solid #555;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: #fff;
    min-width: 54px;
    text-align: center;
  }
  .creatorPanel .opt.active { background: #ff6b35; border-color: #fff; }
  .colorInputGroup { display: flex; gap: 6px; align-items: center; }
  .colorInputGroup input[type="color"] {
    width: 42px; height: 36px;
    border: 2px solid #555;
    border-radius: 6px;
    background: #333;
    cursor: pointer;
    padding: 2px;
  }
  .colorInputGroup input[type="text"] {
    flex: 1;
    padding: 8px;
    background: #333;
    border: 2px solid #555;
    border-radius: 6px;
    color: #fff;
    font-family: monospace;
    font-size: 13px;
    outline: none;
  }
  .nameInputGroup { display: flex; gap: 6px; }
  .nameInputGroup input {
    flex: 1;
    padding: 10px;
    background: #333;
    border: 2px solid #555;
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  .swatchRow { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatchRow .sw {
    width: 30px; height: 30px;
    border-radius: 6px;
    border: 2px solid #555;
    cursor: pointer;
  }
  .swatchRow .sw.active { border-color: #fff; transform: scale(1.1); }

  /* ============ МИР ============ */
  #worldScreen { background: #c8b878; }
  #worldCanvas { display: block; }
  #worldUI {
    position: absolute; top: 10px; left: 10px;
    color: #fff;
    text-shadow: 1px 1px 2px #000;
    pointer-events: none;
    z-index: 5;
  }
  #worldUI .name { font-size: 16px; font-weight: bold; color: #ffd966; }
  #worldUI .pos { font-size: 12px; color: #ccc; }

  /* Панель анимаций снизу */
  #animBar {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: rgba(0,0,0,0.6);
    padding: 6px 10px;
    border-radius: 12px;
    z-index: 6;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 96%;
  }
  #animBar .animBtn {
    width: 46px; height: 46px;
    background: #2a2a40;
    border: 2px solid #555;
    border-radius: 8px;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #animBar .animBtn:hover { background: #3a3a55; }
  #animBar .animBtn.active {
    background: #ff6b35;
    border-color: #fff;
  }

  /* Чат */
  #chatBox {
    position: absolute;
    bottom: 70px;
    left: 10px;
    width: 320px;
    max-width: 60%;
    z-index: 6;
    pointer-events: none;
  }
  #chatHistory {
    background: rgba(0,0,0,0.55);
    border-radius: 8px;
    padding: 6px 10px;
    color: #fff;
    font-size: 12px;
    max-height: 150px;
    overflow-y: auto;
    pointer-events: auto;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  #chatHistory .msg { margin-bottom: 3px; word-wrap: break-word; }
  #chatHistory .msg .nick { color: #ffd966; font-weight: bold; }
  #chatHistory .msg.sys { color: #aaa; font-style: italic; }
  #chatTabs {
    display: flex;
    gap: 4px;
    margin-bottom: 4px;
    pointer-events: auto;
  }
  #chatTabs .tab {
    background: rgba(0,0,0,0.55);
    color: #ccc;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    font-weight: bold;
  }
  #chatTabs .tab.active { background: #ff6b35; color: #fff; }
  #chatInputWrap {
    display: flex;
    gap: 4px;
    pointer-events: auto;
  }
  #chatInput {
    flex: 1;
    background: rgba(0,0,0,0.6);
    border: 2px solid #555;
    border-radius: 6px;
    padding: 6px 10px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  #chatInput::placeholder { color: #888; }
  #chatSend {
    background: #ff6b35;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
  }

  /* Кнопка звука */
  #soundBtn {
    position: absolute; top: 10px; right: 10px;
    width: 42px; height: 42px;
    background: rgba(0,0,0,0.6);
    border: 2px solid #ffd966;
    border-radius: 50%;
    color: #ffd966;
    font-size: 18px;
    cursor: pointer;
    z-index: 15;
    display: flex; align-items: center; justify-content: center;
  }
  #soundBtn.off { color: #666; border-color: #666; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  ::-webkit-scrollbar-thumb { background: #ff6b35; border-radius: 3px; }
</style>

<body>

<!-- ============ ЭКРАН 1: ГЛАВНОЕ МЕНЮ ============ -->

<div id="worldScreen" class="screen hidden">

<!-- ЧАСТЬ 2 ЗАКОНЧЕНА -->
<script>
// ============================================================
//  DragonTown — Beta 6
//  ЧАСТЬ 3: состояние + звук + утилиты
// ============================================================

// ---------- Конфиг персонажа ----------
// Теперь цвета работают как "hue shift" к белому спрайту:
// каждый цвет — множитель. Белый = "#ffffff" (без изменений)
const CONFIG = {
  name: 'Дракон',
  colors: {
    body:    '#ffffff',   // тело
    wings:   '#ffffff',   // крылья
    belly:   '#ffffff',   // живот
    eyes:    '#ffffff',   // глаза
    horns:   '#ffffff',   // рога
    outline: '#000000'    // обводка (по умолчанию чёрная)
  },
  // Стартовая анимация
  animation: 'stand'
};

// ---------- Текущий экран ----------
let currentScreen = 'mainMenu';

// ---------- Утилиты ----------
function $(id) { return document.getElementById(id); }

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
  currentScreen = id;
}

// ---------- Работа с цветом ----------
// Парсим hex в {r, g, b}
function hexToRgb(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  return {
    r: (num >> 16) & 255,
    g: (num >> 8) & 255,
    b: num & 255
  };
}

// RGB → hex
function rgbToHex(r, g, b) {
  r = Math.max(0, Math.min(255, Math.round(r)));
  g = Math.max(0, Math.min(255, Math.round(g)));
  b = Math.max(0, Math.min(255, Math.round(b)));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

// Осветление / затемнение
function shade(hex, percent) {
  const c = hexToRgb(hex);
  const amt = Math.round(2.55 * percent);
  return rgbToHex(c.r + amt, c.g + amt, c.b + amt);
}

// HSL → RGB (для hue shift)
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(1, s));
  l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60)       { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return {
    r: (r + m) * 255,
    g: (g + m) * 255,
    b: (b + m) * 255
  };
}

// RGB → HSL
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)); break;
      case g: h = ((b - r) / d + 2); break;
      case b: h = ((r - g) / d + 4); break;
    }
    h *= 60;
  }
  return { h, s, l };
}

// ============================================================
//  ЗВУК (Web Audio API)
// ============================================================
const Sound = (() => {
  let ctxA = null;
  let enabled = true;
  let ambientGain = null;
  let ambientStarted = false;

  function ensure() {
    if (!ctxA) {
      try {
        ctxA = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { return null; }
    }
    if (ctxA.state === 'suspended') ctxA.resume();
    return ctxA;
  }

  function beep(freq, duration, type = 'square', volume = 0.06) {
    const c = ensure(); if (!c || !enabled) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(volume, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + duration + 0.01);
  }

  function click() { beep(660, 0.08, 'square', 0.06); }

  function hover() { beep(880, 0.05, 'sine', 0.025); }

  function step() {
    const c = ensure(); if (!c || !enabled) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180 + Math.random() * 40, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(60, c.currentTime + 0.08);
    g.gain.setValueAtTime(0.03, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.1);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.11);
  }

  // ==== Звуки для анимаций ====

  function sit() {
    // Мягкий вздох — нисходящий тон
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(440, t);
    o.frequency.exponentialRampToValueAtTime(220, t + 0.35);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.45);
  }

  function dance() {
    // Весёлое арпеджио
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const notes = [523, 659, 784, 1046, 784, 659];
    notes.forEach((fr, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(fr, t + i * 0.08);
      g.gain.setValueAtTime(0.0001, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.07, t + i * 0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.15);
      o.connect(g); g.connect(c.destination);
      o.start(t + i * 0.08);
      o.stop(t + i * 0.08 + 0.18);
    });
  }

  function wave() {
    // «Фьють» — быстрый свист
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(1200, t + 0.18);
    o.frequency.exponentialRampToValueAtTime(800, t + 0.28);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.35);
  }

  function roar() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    const o1 = c.createOscillator();
    const o2 = c.createOscillator();
    const g = c.createGain();
    const f = c.createBiquadFilter();
    o1.type = 'sawtooth';
    o2.type = 'square';
    o1.frequency.setValueAtTime(95, t);
    o1.frequency.linearRampToValueAtTime(60, t + 0.7);
    o2.frequency.setValueAtTime(48, t);
    o2.frequency.linearRampToValueAtTime(32, t + 0.7);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(200, t + 0.7);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(c.destination);
    o1.start(t); o2.start(t);
    o1.stop(t + 0.8); o2.stop(t + 0.8);
  }

  function enterWorld() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    [440, 550, 660, 880].forEach((fr, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(fr, t + i * 0.08);
      g.gain.setValueAtTime(0.0001, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.06, t + i * 0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.25);
      o.connect(g); g.connect(c.destination);
      o.start(t + i * 0.08);
      o.stop(t + i * 0.08 + 0.28);
    });
  }

  function save() {
    const c = ensure(); if (!c || !enabled) return;
    const t = c.currentTime;
    [520, 780].forEach((fr, i) => {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(fr, t + i * 0.1);
      g.gain.setValueAtTime(0.0001, t + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.08, t + i * 0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.2);
      o.connect(g); g.connect(c.destination);
      o.start(t + i * 0.1);
      o.stop(t + i * 0.1 + 0.22);
    });
  }

  function chatMsg() {
    // Короткий «бип» при получении сообщения
    beep(880, 0.06, 'sine', 0.04);
    setTimeout(() => beep(1100, 0.06, 'sine', 0.03), 60);
  }

  function startAmbient() {
    const c = ensure(); if (!c || !enabled || ambientStarted) return;
    ambientStarted = true;
    const bufferSize = 2 * c.sampleRate;
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 320;
    ambientGain = c.createGain();
    ambientGain.gain.value = 0.012;
    noise.connect(filter); filter.connect(ambientGain); ambientGain.connect(c.destination);
    noise.start();
  }

  function toggle() {
    enabled = !enabled;
    if (ambientGain) ambientGain.gain.value = enabled ? 0.012 : 0;
    return enabled;
  }

  return {
    click, hover, step,
    sit, dance, wave, roar,
    enterWorld, save, chatMsg,
    startAmbient, toggle, ensure
  };
})();

<script>
// ============================================================
//  ЧАСТЬ 4: загрузка PNG, нарезка спрайт-листов, перекраска
// ============================================================

// ---------- Загрузчик картинок ----------
const SpriteAssets = {
  images: {},      // исходные картинки
  frames: {},      // нарезанные кадры (canvas)
  loaded: 0,
  total: 0,
  ready: false,
  onReadyCallbacks: []
};

function loadImage(name, src) {
  return new Promise((resolve, reject) => {
    SpriteAssets.total++;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      SpriteAssets.images[name] = img;
      SpriteAssets.loaded++;
      resolve(img);
    };
    img.onerror = () => {
      console.error('Не загрузилось:', src);
      resolve(null); // не блокируем загрузку остальных
    };
    img.src = src;
  });
}

// ============================================================
//  Нарезка спрайт-листа на кадры
//  img — картинка
//  count — сколько кадров
//  targetH — целевая высота кадра (пикселей)
//  Возвращает массив canvas-ов
// ============================================================
function sliceSpriteSheet(img, count, targetH = 96) {
  const frames = [];
  const frameW = img.width / count;
  const frameH = img.height;

  // Соотношение сторон кадра
  const aspect = frameW / frameH;
  const targetW = Math.round(targetH * aspect);

  for (let i = 0; i < count; i++) {
    const c = document.createElement('canvas');
    c.width = targetW;
    c.height = targetH;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;

    g.drawImage(
      img,
      i * frameW, 0, frameW, frameH,   // источник
      0, 0, targetW, targetH           // куда
    );

    frames.push(c);
  }
  return frames;
}

// ============================================================
//  Перекраска спрайта через Canvas
//  Белые/серые пиксели умножаются на выбранный цвет,
//  обводка (чёрная) остаётся чёрной.
// ============================================================
function recolorSprite(srcCanvas, bodyColor, wingColor, bellyColor, eyeColor, hornColor) {
  const w = srcCanvas.width;
  const h = srcCanvas.height;

  const out = document.createElement('canvas');
  out.width = w;
  out.height = h;
  const g = out.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(srcCanvas, 0, 0);

  // Читаем пиксели
  let imgData;
  try {
    imgData = g.getImageData(0, 0, w, h);
  } catch (e) {
    // Если CORS блокирует — возвращаем как есть
    return out;
  }

  const data = imgData.data;
  const body = hexToRgb(bodyColor);
  const wings = hexToRgb(wingColor);
  const belly = hexToRgb(bellyColor);
  const eyes = hexToRgb(eyeColor);
  const horns = hexToRgb(hornColor);

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const gg = data[i + 1];
    const b = data[i + 2];
    const a = data[i + 3];
    if (a === 0) continue;

    // Определяем, к какой части относится пиксель
    // Логика: белый/серый → тело; кремовый → крылья/живот;
    // чёрный → обводка (не трогаем); голубой → глаза;
    // коричневый → рога (тоже не трогаем, или перекрашиваем в horns)
    const max = Math.max(r, gg, b);
    const min = Math.min(r, gg, b);
    const sat = max === 0 ? 0 : (max - min) / max;

    // Обводка / тёмное — оставляем
    if (max < 60) continue;

    // Сильно насыщенные пиксели (глаза, цветные детали) — определяем по оттенку
    if (sat > 0.35) {
      // Голубые/синие — глаза
      if (b > r && b > gg) {
        data[i]     = (r / 255) * eyes.r;
        data[i + 1] = (gg / 255) * eyes.g;
        data[i + 2] = (b / 255) * eyes.b;
      }
      // Оранжевые/коричневые — рога
      else if (r > gg && r > b) {
        data[i]     = (r / 255) * horns.r;
        data[i + 1] = (gg / 255) * horns.g;
        data[i + 2] = (b / 255) * horns.b;
      }
      continue;
    }

    // Слабый оттенок (кремовый) — крылья/живот
    if (sat > 0.05) {
      // Различаем крылья и живот по положению: верх = крылья, низ = живот
      const y = Math.floor((i / 4) / w);
      const isUpperHalf = y < h * 0.55;
      const t = isUpperHalf ? wings : belly;
      data[i]     = (r / 255) * t.r;
      data[i + 1] = (gg / 255) * t.g;
      data[i + 2] = (b / 255) * t.b;
      continue;
    }

    // Серые / белые пиксели — тело
    data[i]     = (r / 255) * body.r;
    data[i + 1] = (gg / 255) * body.g;
    data[i + 2] = (b / 255) * body.b;
  }

  g.putImageData(imgData, 0, 0);
  return out;
}

// ============================================================
//  Кеш перекрашенных спрайтов
//  Ключ — комбинация цветов. Если уже делали — не пересчитываем.
// ============================================================
const recolorCache = {};

function getRecoloredFrame(baseFrameKey, frameIndex, colors) {
  const key = baseFrameKey + '_' + frameIndex + '_' +
    colors.body + colors.wings + colors.belly + colors.eyes + colors.horns;

  if (recolorCache[key]) return recolorCache[key];

  const baseFrame = SpriteAssets.frames[baseFrameKey][frameIndex];
  const recolored = recolorSprite(
    baseFrame,
    colors.body,
    colors.wings,
    colors.belly,
    colors.eyes,
    colors.horns
  );
  recolorCache[key] = recolored;
  return recolored;
}

// Сбрасываем кеш при смене цвета
function clearRecolorCache() {
  for (const k in recolorCache) delete recolorCache[k];
}

// ============================================================
//  Загрузка всех спрайтов
// ============================================================
async function loadAllSprites() {
  const assets = [
    { name: 'walk',  src: 'dragon_white_walk.png', frames: 6, h: 96 },
    { name: 'sit',   src: 'dragon_white_sit.png',  frames: 2, h: 96 },
    { name: 'tree',  src: 'tree.png',              frames: 1, h: 140 },
    { name: 'house', src: 'house.png',             frames: 1, h: 180 },
    { name: 'grass', src: 'grass.png',             frames: 1, h: 128 }
  ];

  for (const a of assets) {
    const img = await loadImage(a.name, a.src);
    if (img) {
      SpriteAssets.frames[a.name] = sliceSpriteSheet(img, a.frames, a.h);
    }
  }

  SpriteAssets.ready = true;
  SpriteAssets.onReadyCallbacks.forEach(cb => cb());
  console.log('%c✅ Спрайты загружены', 'color:#4caf50;font-weight:bold');
}

// Хелпер: выполнить что-то после загрузки спрайтов
function onSpritesReady(cb) {
  if (SpriteAssets.ready) cb();
  else SpriteAssets.onReadyCallbacks.push(cb);
}

// ---------- Запускаем загрузку сразу ----------
loadAllSprites();

// ============================================================
//  Хелпер отрисовки дракона с перекраской
//  anim: 'walk' | 'sit'
//  frame: индекс кадра
//  facing: true — отразить влево
// ============================================================
function drawDragonAnim(ctx, cx, cy, size, anim, frame, facing, colors) {
  if (!SpriteAssets.ready) return;
  const frames = SpriteAssets.frames[anim];
  if (!frames || !frames.length) return;

  frame = frame % frames.length;
  const recolored = getRecoloredFrame(anim, frame, colors);

  const aspect = recolored.width / recolored.height;
  const drawH = size;
  const drawW = size * aspect;

  ctx.save();
  ctx.imageSmoothingEnabled = false;

  if (facing) {
    ctx.translate(cx, cy);
    ctx.scale(-1, 1);
    ctx.drawImage(recolored, -drawW / 2, -drawH / 2, drawW, drawH);
  } else {
    ctx.drawImage(recolored, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
  }

  ctx.restore();
}

// Тень под драконом
function drawDragonShadow(ctx, cx, cy, size) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, cy, size * 0.35, size * 0.1, 0, 0, Math.PI * 2);
  ctx.fill();
}

console.log('%c📦 Загрузчик спрайтов готов', 'color:#4caf50;font-weight:bold');
</script>

<script>
// ============================================================
//  ЧАСТЬ 5: редактор дракона
//  Перекраска тела / крыльев / живота / глаз / рогов / обводки

// ============================================================

const previewCanvas = $('previewCanvas');
const pctx = previewCanvas.getContext('2d');
pctx.imageSmoothingEnabled = false;
const PW = previewCanvas.width;
const PH = previewCanvas.height;

let previewFrame = 0;
let previewTimer = 0;
let previewAnimId = null;
let previewFacing = false;
let previewAnim = 'walk'; // walk | sit

// ---------- Отрисовка превью ----------
function renderPreview() {
  pctx.clearRect(0, 0, PW, PH);

  // Фон
  pctx.fillStyle = '#7ec87e';
  pctx.fillRect(0, 0, PW, PH);

  // Пиксельные пятнышки
  pctx.fillStyle = '#6eb86e';
  const seed = [[20, 40], [70, 90], [200, 30], [230, 200], [50, 220], [140, 180]];
  seed.forEach(([x, y]) => {
    pctx.fillRect(x, y, 12, 8);
    pctx.fillRect(x + 4, y - 4, 8, 6);
  });

  if (!SpriteAssets.ready) {
    // Пока не загрузились спрайты — показываем текст
    pctx.fillStyle = '#333';
    pctx.font = '14px Trebuchet MS';
    pctx.textAlign = 'center';
    pctx.fillText('Загрузка...', PW / 2, PH / 2);
    return;
  }

  // Тень
  drawDragonShadow(pctx, PW / 2, PH / 2 + 70, 220);

  // Дракон
  const size = 220;
  drawDragonAnim(
    pctx,
    PW / 2, PH / 2 + 10,
    size,
    previewAnim,
    previewFrame,
    previewFacing,
    CONFIG.colors
  );
}

function previewLoop(t) {
  if (currentScreen === 'creatorScreen') {
    if (t - previewTimer > 200) {
      previewTimer = t;
      previewFrame = (previewFrame + 1) % 6;
      renderPreview();
    }
  }
  previewAnimId = requestAnimationFrame(previewLoop);
}
previewAnimId = requestAnimationFrame(previewLoop);

// После загрузки спрайтов — перерисовываем
onSpritesReady(renderPreview);

// ============================================================
//  Хелперы панели редактора
// ============================================================
const creatorPanel = $('creatorPanel');

function makeRow(labelText) {
  const row = document.createElement('div');
  row.className = 'row';
  if (labelText) {
    const l = document.createElement('label');
    l.textContent = labelText;
    row.appendChild(l);
  }
  return row;
}

// Поле цвета: color input + hex input
function makeColorField(currentValue, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'colorInputGroup';

  const ci = document.createElement('input');
  ci.type = 'color';
  ci.value = currentValue;

  const hi = document.createElement('input');
  hi.type = 'text';
  hi.value = currentValue;
  hi.maxLength = 7;

  ci.addEventListener('input', () => {
    hi.value = ci.value;
    onChange(ci.value);
    renderPreview();
  });
  hi.addEventListener('input', () => {
    let v = hi.value.trim();
    if (!v.startsWith('#')) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      ci.value = v;
      onChange(v);
      renderPreview();
    }
  });

  wrap.appendChild(ci);
  wrap.appendChild(hi);
  return wrap;
}

// Палитра готовых цветов
const PALETTE = [
  '#ffffff', '#f5c040', '#e03020', '#ff6b35', '#a0522d',
  '#2ecc71', '#27ae60', '#1abc9c', '#3498db', '#2980b9',
  '#9b59b6', '#8e44ad', '#e91e63', '#95a5a6', '#34495e',
  '#000000', '#ffd966', '#c0392b', '#e67e22', '#7f8c8d'
];

function makeSwatches(currentValue, onPick) {
  const wrap = document.createElement('div');
  wrap.className = 'swatchRow';
  PALETTE.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'sw' + (c.toLowerCase() === currentValue.toLowerCase() ? ' active' : '');
    sw.style.background = c;
    sw.onclick = () => {
      Sound.click();
      wrap.querySelectorAll('.sw').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      onPick(c);
      clearRecolorCache(); // сбрасываем кеш перекраски
      renderPreview();
    };
    wrap.appendChild(sw);
  });
  return wrap;
}

// Хелпер: блок «цвет + палитра»
function colorBlock(labelText, key) {
  const row = makeRow(labelText);
  row.appendChild(makeColorField(CONFIG.colors[key], v => {
    CONFIG.colors[key] = v;

  const pr = document.createElement('div');

  pr.appendChild(makeSwatches(CONFIG.colors[key], v => {

}

// ============================================================
//  Построение панели по табу
// ============================================================
function buildPanelForTab(tab) {

  if (tab === 'body') {

  // ---------------- ГЛАЗА ----------------
  else if (tab === 'eyes') {

<!-- ЧАСТЬ 6 ЗАКОНЧЕНА -->
<script>
// ============================================================
//  ЧАСТЬ 7: игровой мир
//  Трава-паттерн, деревья, дома, дракон с перекраской
//  Без лагов — всё через drawImage закешированных спрайтов
// ============================================================

const worldCanvas = $('worldCanvas');
const wctx = worldCanvas.getContext('2d');
wctx.imageSmoothingEnabled = false;

let WW = window.innerWidth;
let WH = window.innerHeight;

function resizeWorld() {
  WW = window.innerWidth;
  WH = window.innerHeight;
  worldCanvas.width = WW;
  worldCanvas.height = WH;
  wctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', () => {
  if (currentScreen === 'worldScreen') resizeWorld();
});

// ============================================================
//  Мир
// ============================================================
const WORLD = {
  width: 2800,
  height: 2200,
  trees: [],
  houses: []
};

// Детерминированный рандом — чтобы карта не менялась каждый запуск
let _seed = 98765;
function rnd() {
  _seed = (_seed * 9301 + 49297) % 233280;
  return _seed / 233280;
}
function rndRange(a, b) { return a + rnd() * (b - a); }

// Проверка — не пересекается ли с уже существующими объектами
function canPlace(x, y, r) {
  for (const t of WORLD.trees) {
    if (Math.hypot(x - t.x, y - t.y) < (t.r + r) * 0.8) return false;
  }
  for (const h of WORLD.houses) {
    if (Math.abs(x - h.x) < h.w * 0.6 + r && Math.abs(y - h.y) < h.h * 0.6 + r) return false;
  }
  return true;
}

function generateWorld() {
  _seed = 98765;
  WORLD.trees = [];
  WORLD.houses = [];

  // ---- Дома ----
  const houseSpots = [
    { x: 500,  y: 500  },
    { x: 2200, y: 450  },
    { x: 600,  y: 1700 },
    { x: 2200, y: 1750 },
    { x: 1400, y: 300  },
    { x: 1400, y: 1900 }
  ];
  houseSpots.forEach(p => {
    WORLD.houses.push({
      x: p.x, y: p.y,
      w: 200, h: 200
    });
  });

  // ---- Деревья ----
  for (let i = 0; i < 180; i++) {
    for (let tries = 0; tries < 20; tries++) {
      const x = rndRange(80, WORLD.width - 80);
      const y = rndRange(80, WORLD.height - 80);
      const r = rndRange(50, 80);
      // Не слишком близко к центру (там игрок спавнится)
      if (Math.hypot(x - WORLD.width / 2, y - WORLD.height / 2) < 150) continue;
      if (canPlace(x, y, r)) {
        WORLD.trees.push({ x, y, r });
        break;
      }
    }
  }

  // Сортируем деревья по Y — для правильной отрисовки 2.5D
  WORLD.trees.sort((a, b) => a.y - b.y);
}

generateWorld();

// ============================================================
//  Фон-паттерн травы
// ============================================================
let grassPattern = null;

function initGrassPattern() {
  if (!SpriteAssets.ready || !SpriteAssets.frames.grass) return;
  const tile = SpriteAssets.frames.grass[0];
  // Небольшой тайл-обрезок из 64×64 куска
  const small = document.createElement('canvas');
  small.width = 128;
  small.height = 128;
  const sg = small.getContext('2d');
  sg.imageSmoothingEnabled = false;
  sg.drawImage(tile, 0, 0, tile.width, tile.height, 0, 0, 128, 128);
  grassPattern = wctx.createPattern(small, 'repeat');
}
onSpritesReady(initGrassPattern);

// ============================================================
//  Игрок
// ============================================================
const player = {
  x: WORLD.width / 2,
  y: WORLD.height / 2,
  speed: 3.5,
  targetX: WORLD.width / 2,
  targetY: WORLD.height / 2,
  facing: false,
  frame: 0,
  animTimer: 0,
  moving: false,
  stepTimer: 0,
  animation: 'stand'   // stand | walk | sit | dance | wave | roar
};

const camera = { x: player.x, y: player.y };

// ============================================================
//  Управление
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
  // Не срабатывает, если фокус в поле чата
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// Клик по миру
worldCanvas.addEventListener('click', e => {
  const rect = worldCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  player.targetX = mx - WW / 2 + camera.x;
  player.targetY = my - WH / 2 + camera.y + 30;
  // Если был в сидячем/танце — переключаем на ходьбу
  if (player.animation !== 'walk') setAnimation('walk');
});

// ============================================================
//  Смена анимации
// ============================================================
function setAnimation(anim) {
  player.animation = anim;
  player.frame = 0;
  // Подсветка активной кнопки
  document.querySelectorAll('#animBar .animBtn').forEach(b => {
    b.classList.toggle('active', b.dataset.anim === anim);
  });
  // Звук
  if (anim === 'sit')   Sound.sit();
  if (anim === 'dance') Sound.dance();
  if (anim === 'wave')  Sound.wave();
  if (anim === 'roar')  Sound.roar();
}

// Кнопки анимаций
document.querySelectorAll('#animBar .animBtn').forEach(b => {
  b.addEventListener('click', () => {
    setAnimation(b.dataset.anim);
  });
});

// ============================================================
//  Цикл мира
// ============================================================
let worldRunning = false;
let worldLastT = 0;

function startWorld() {
  resizeWorld();
  initGrassPattern();
  player.x = WORLD.width / 2;
  player.y = WORLD.height / 2;
  player.targetX = player.x;
  player.targetY = player.y;
  camera.x = player.x;
  camera.y = player.y;
  player.animation = 'stand';
  setAnimation('stand');
  worldRunning = true;
  worldLastT = performance.now();
  requestAnimationFrame(worldLoop);
}

function worldLoop(t) {
  if (!worldRunning || currentScreen !== 'worldScreen') return;
  const dt = t - worldLastT;
  worldLastT = t;
  updateWorld(dt, t);
  drawWorld();
  requestAnimationFrame(worldLoop);
}

// ============================================================
//  Обновление
// ============================================================
function updateWorld(dt, t) {
  // Если пользователь сидит — не двигается от клавиш
  const canMove = (player.animation !== 'sit');

  let dx = 0, dy = 0;
  if (canMove) {
    if (keys['w'] || keys['arrowup'])    dy -= 1;
    if (keys['s'] || keys['arrowdown'])  dy += 1;
    if (keys['a'] || keys['arrowleft'])  dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
  }

  player.moving = false;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed;
    player.y += (dy / len) * player.speed;
    player.targetX = player.x;
    player.targetY = player.y;
    player.moving = true;
    if (dx < 0) player.facing = true;
    else if (dx > 0) player.facing = false;
    // Если стоит/сидит — переключаемся на ходьбу
    if (player.animation === 'stand' || player.animation === 'sit') {
      setAnimation('walk');
    }
  } else if (canMove) {
    const tdx = player.targetX - player.x;
    const tdy = player.targetY - player.y;
    const dist = Math.hypot(tdx, tdy);
    if (dist > 2) {
      player.x += (tdx / dist) * player.speed;
      player.y += (tdy / dist) * player.speed;
      player.moving = true;
      if (tdx < 0) player.facing = true;
      else if (tdx > 0) player.facing = false;
      if (player.animation === 'stand' || player.animation === 'sit') {
        setAnimation('walk');
      }
    }
  }

  // Границы
  player.x = Math.max(60, Math.min(WORLD.width - 60, player.x));
  player.y = Math.max(60, Math.min(WORLD.height - 60, player.y));

  // Анимация: кадры
  if (player.moving) {
    if (t - player.animTimer > 130) {
      player.animTimer = t;
      player.frame = (player.frame + 1) % 6;
    }
    if (t - player.stepTimer > 260) {
      player.stepTimer = t;
      Sound.step();
    }
  } else {
    // Стоит — замедленная анимация покоя
    if (player.animation === 'walk') {
      // Переключились на «стоит» после остановки
      setAnimation('stand');
    }
    if (t - player.animTimer > 500) {
      player.animTimer = t;
      player.frame = (player.frame + 1) % 2;
    }
  }

  // Камера плавно
  camera.x += (player.x - camera.x) * 0.12;
  camera.y += (player.y - camera.y) * 0.12;

  // UI
  $('worldPos').textContent = Math.round(player.x) + ', ' + Math.round(player.y);
}

// ============================================================
//  Отрисовка
// ============================================================
function drawWorld() {
  // Фон-трава
  if (grassPattern) {
    wctx.fillStyle = grassPattern;
    wctx.fillRect(0, 0, WW, WH);
  } else {
    wctx.fillStyle = '#c8b878';
    wctx.fillRect(0, 0, WW, WH);
  }

  const offX = WW / 2 - camera.x;
  const offY = WH / 2 - camera.y;

  // ---- Дома (рисуются под деревьями) ----
  if (SpriteAssets.ready && SpriteAssets.frames.house) {
    const houseImg = SpriteAssets.frames.house[0];
    for (const h of WORLD.houses) {
      const sx = h.x + offX;
      const sy = h.y + offY;
      if (sx < -300 || sx > WW + 300 || sy < -300 || sy > WH + 300) continue;
      const dw = houseImg.width;
      const dh = houseImg.height;
      wctx.drawImage(houseImg, Math.round(sx - dw / 2), Math.round(sy - dh), dw, dh);
    }
  }

  // ---- Деревья ----
  if (SpriteAssets.ready && SpriteAssets.frames.tree) {
    const treeImg = SpriteAssets.frames.tree[0];
    for (const t of WORLD.trees) {
      const sx = t.x + offX;
      const sy = t.y + offY;
      if (sx < -200 || sx > WW + 200 || sy < -250 || sy > WH + 250) continue;
      const dw = treeImg.width;
      const dh = treeImg.height;
      wctx.drawImage(treeImg, Math.round(sx - dw / 2), Math.round(sy - dh), dw, dh);
    }
  }

  // ---- Игрок ----
  drawPlayer(offX, offY);
}

// ============================================================
//  Игрок
// ============================================================
function drawPlayer(offX, offY) {
  const size = 110;
  const px = player.x + offX;
  const py = player.y + offY;

  // Тень
  drawDragonShadow(wctx, px, py + 8, size);

  // Спрайт
  if (SpriteAssets.ready) {
    // Выбор анимации: walk (6 кадров) или sit (2 кадра)
    const anim = (player.animation === 'sit') ? 'sit' : 'walk';

    // Если стоим / танцуем / махаем / рычим — используем ходьбу как базу,
    // но останавливаем кадр на 0 (нейтральная поза).
    let frame = 0;
    if (anim === 'walk' && (player.animation === 'walk' || player.moving)) {
      frame = player.frame;
    } else if (anim === 'walk') {
      // Стоим — показываем только кадр 0 (спокойный)
      frame = 0;
    } else {
      frame = player.frame;
    }

    drawDragonAnim(
      wctx,
      px,
      py - 20,
      size,
      anim,
      frame,
      player.facing,
      CONFIG.colors
    );
  }

  // Имя
  wctx.save();
  wctx.font = 'bold 13px Trebuchet MS';
  wctx.textAlign = 'center';
  wctx.fillStyle = '#000';
  wctx.fillText(CONFIG.name, px + 1, py - 75 + 1);
  wctx.fillStyle = '#ffd966';
  wctx.fillText(CONFIG.name, px, py - 75);
  wctx.restore();

  // Пузырь над головой для танца / рёва
  if (player.animation === 'dance') {
    wctx.font = '22px Trebuchet MS';
    wctx.textAlign = 'center';
    wctx.fillText('💃', px, py - 90);
  } else if (player.animation === 'roar') {
    wctx.font = '22px Trebuchet MS';
    wctx.textAlign = 'center';
    wctx.fillText('💢', px, py - 90);
  } else if (player.animation === 'wave') {
    wctx.font = '22px Trebuchet MS';
    wctx.textAlign = 'center';
    wctx.fillText('👋', px + 30, py - 85);
  }
}

console.log('%c🌍 Мир готов', 'color:#4caf50;font-weight:bold');
</script>

<script>

};

      t.classList.add('active');
      chatState.currentTab = t.dataset.chat;
      renderChatHistory();
    });
  });

  // Отправка сообщения

// ---------- Отправка сообщения ----------
function sendChatMessage() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;

  // Добавляем в чат
  addChatMessage('user', CONFIG.name, text, chatState.currentTab);

  // Очищаем поле
  input.value = '';
  input.blur();
}

// ---------- Добавление сообщения ----------
function addChatMessage(type, nick, text, tab = 'local') {
  chatState.history.push({
    type,         // 'user' | 'sys'
    nick,
    text,
    tab,
    time: Date.now()
  });

  // Ограничиваем историю 50 сообщениями
  if (chatState.history.length > 50) {
    chatState.history.shift();
  }

  renderChatHistory();

  // Звук при получении не своего сообщения
  if (type === 'user' && nick !== CONFIG.name) {
    Sound.chatMsg();
  }
}

// ---------- Отрисовка истории ----------
function renderChatHistory() {
  const box = $('chatHistory');
  box.innerHTML = '';

  // Фильтруем по текущему табу
  const visible = chatState.history.filter(m => {
    if (m.type === 'sys') return true;
    if (chatState.currentTab === 'local') return m.tab === 'local' || !m.tab;
    return m.tab === chatState.currentTab;
  });

  // Берём последние 12 сообщений
  const recent = visible.slice(-12);

  recent.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg' + (m.type === 'sys' ? ' sys' : '');
    if (m.type === 'sys') {
      div.textContent = m.text;
    } else {
      const tabPrefix = {
        local: '',
        party: '[P] ',
        personal: '[→] '
      }[m.tab] || '';
      div.innerHTML = `<span class="nick">${tabPrefix}${escapeHtml(m.nick)}:</span> ${escapeHtml(m.text)}`;
    }
    box.appendChild(div);
  });

  // Прокручиваем вниз
  box.scrollTop = box.scrollHeight;
}

// Экранирование HTML в сообщениях
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ---------- Фокус на чате по клавише T ----------
window.addEventListener('keydown', e => {
  if (currentScreen !== 'worldScreen') return;
  // Не срабатывает, если уже в input
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

  if (e.key === 't' || e.key === 'T' || e.key === 'е' || e.key === 'Е') {
    e.preventDefault();
    $('chatInput').focus();
  }
  // Escape — закрыть фокус
  if (e.key === 'Escape') {
    $('chatInput').blur();
  }
});

// ============================================================
//  Финал — инициализация всего
// ============================================================
window.addEventListener('load', () => {
  // Превью редактора (когда спрайты готовы)
  onSpritesReady(() => {
    renderPreview();
    renderMenuPreview();
  });
});

// Пауза анимации при сворачивании
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // requestAnimationFrame сам приостановится
  }
});

// Escape из редактора / серверов
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (currentScreen === 'creatorScreen' || currentScreen === 'serverScreen') {
      Sound.click();
      show('mainMenu');
      renderMenuPreview();
    }
  }
});

// Предотвращаем скролл страницы колёсиком в мире
document.addEventListener('wheel', e => {
  if (currentScreen === 'worldScreen') {
    e.preventDefault();
  }
}, { passive: false });
